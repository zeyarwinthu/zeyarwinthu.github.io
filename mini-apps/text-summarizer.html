<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Text Summarizer</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,400&family=JetBrains+Mono:wght@400;500;600&family=Newsreader:ital,wght@0,400;0,500;1,400&display=swap');

  :root {
    --bg: #14110f;
    --panel: #1c1815;
    --panel-2: #221d19;
    --ink: #e8e1d6;
    --ink-dim: #9c9388;
    --line: #322c26;
    --accent: #d49a5a;
    --accent-soft: rgba(212, 154, 90, 0.14);
    --green: #8fb573;
    --red: #d9776c;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }

  body {
    background:
      radial-gradient(900px 500px at 80% -10%, rgba(212,154,90,0.07), transparent 60%),
      var(--bg);
    color: var(--ink);
    font-family: 'JetBrains Mono', monospace;
    display: flex;
    flex-direction: column;
    height: 100vh;
    overflow: hidden;
  }

  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 18px 28px;
    border-bottom: 1px solid var(--line);
    background: linear-gradient(180deg, var(--panel), transparent);
    flex-wrap: wrap;
    gap: 12px;
  }
  .brand { display: flex; align-items: baseline; gap: 12px; }
  .brand h1 {
    font-family: 'Fraunces', serif; font-weight: 600; font-size: 1.5rem; letter-spacing: -0.01em;
  }
  .brand .dot { color: var(--accent); }
  .brand span.sub { font-family: 'Fraunces', serif; font-style: italic; color: var(--ink-dim); font-size: 0.92rem; }

  .toolbar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  select, button {
    font-family: 'JetBrains Mono', monospace; font-size: 0.72rem;
    text-transform: uppercase; letter-spacing: 0.08em;
    color: var(--ink); background: var(--panel-2);
    border: 1px solid var(--line); padding: 8px 14px; border-radius: 7px;
    cursor: pointer; transition: all 0.18s ease;
  }
  select:hover, button:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
  button:active { transform: translateY(1px); }
  button.primary { border-color: var(--accent); color: var(--accent); font-weight: 600; }
  button:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

  main { flex: 1; display: grid; grid-template-columns: 1fr 1fr; overflow: hidden; }
  .pane { display: flex; flex-direction: column; overflow: hidden; }
  .pane.left { border-right: 1px solid var(--line); }
  .pane-head {
    padding: 10px 22px; font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.12em;
    color: var(--ink-dim); border-bottom: 1px solid var(--line);
    display: flex; justify-content: space-between; align-items: center;
  }
  .pane-head .small-btn {
    text-transform: uppercase; font-size: 0.62rem; padding: 4px 9px;
    border: 1px solid var(--line); border-radius: 6px; cursor: pointer;
    color: var(--ink-dim); background: transparent; transition: all 0.18s ease;
  }
  .pane-head .small-btn:hover { border-color: var(--accent); color: var(--accent); }

  textarea {
    flex: 1; width: 100%; background: transparent; border: none; outline: none; resize: none;
    color: var(--ink); font-family: 'Newsreader', serif; font-size: 1.05rem; line-height: 1.75rem;
    padding: 22px 26px; caret-color: var(--accent);
  }
  textarea::placeholder { color: var(--ink-dim); font-style: italic; }
  textarea::selection { background: var(--accent-soft); }

  .output {
    flex: 1; overflow: auto; padding: 22px 26px;
    font-family: 'Newsreader', serif; font-size: 1.08rem; line-height: 1.8rem;
  }
  .output h3 {
    font-family: 'Fraunces', serif; font-size: 0.72rem; text-transform: uppercase;
    letter-spacing: 0.14em; color: var(--accent); margin: 18px 0 10px; font-weight: 600;
  }
  .output h3:first-child { margin-top: 0; }
  .output p { margin-bottom: 12px; }
  .output ul { margin: 0 0 14px 4px; list-style: none; }
  .output li { position: relative; padding-left: 22px; margin-bottom: 9px; }
  .output li::before {
    content: '\2014'; position: absolute; left: 0; color: var(--accent);
  }
  .output .tldr {
    border-left: 2px solid var(--accent); padding: 4px 0 4px 16px;
    font-style: italic; color: var(--ink); margin-bottom: 16px;
  }
  .empty-state { color: var(--ink-dim); font-style: italic; }

  .loading { display: flex; flex-direction: column; gap: 12px; }
  .shimmer {
    height: 14px; border-radius: 6px;
    background: linear-gradient(90deg, var(--panel-2) 25%, var(--line) 50%, var(--panel-2) 75%);
    background-size: 200% 100%; animation: shimmer 1.3s infinite;
  }
  @keyframes shimmer { from { background-position: 200% 0; } to { background-position: -200% 0; } }
  .thinking { color: var(--accent); font-family: 'JetBrains Mono', monospace; font-size: 0.78rem; letter-spacing: 0.08em; margin-bottom: 14px; }
  .thinking::after { content: ''; animation: dots 1.4s steps(4,end) infinite; }
  @keyframes dots { 0%{content:'';} 25%{content:'.';} 50%{content:'..';} 75%{content:'...';} }

  .focus-input {
    margin: 8px 26px 0; padding: 8px 0; background: transparent; border: none;
    border-bottom: 1px solid var(--line); color: var(--ink);
    font-family: 'Newsreader', serif; font-style: italic; font-size: 0.95rem;
    outline: none; transition: border-color 0.15s;
  }
  .focus-input:focus { border-bottom-color: var(--accent); }
  .focus-input::placeholder { color: var(--ink-dim); }

  .cursor {
    display: inline-block; width: 0.55em; color: var(--accent);
    animation: blink 1.1s steps(1) infinite; margin-left: 1px;
    transform: translateY(-1px);
  }
  @keyframes blink { 50% { opacity: 0; } }

  footer {
    padding: 10px 28px; border-top: 1px solid var(--line); background: var(--panel);
    font-size: 0.72rem; letter-spacing: 0.04em; min-height: 40px;
    display: flex; align-items: center; gap: 18px; flex-wrap: wrap;
  }
  footer .stat b { color: var(--accent); font-weight: 500; }
  footer .stat { color: var(--ink-dim); }
  .status-err { color: var(--red); }
  .status-ok { color: var(--green); }
  .reduction { margin-left: auto; color: var(--ink-dim); font-family: 'Fraunces', serif; font-style: italic; }

  .toast {
    position: fixed; bottom: 60px; left: 50%; transform: translateX(-50%) translateY(20px);
    background: var(--panel-2); border: 1px solid var(--accent); color: var(--accent);
    padding: 10px 20px; border-radius: 8px; font-size: 0.72rem; letter-spacing: 0.06em;
    opacity: 0; pointer-events: none; transition: all 0.3s ease; z-index: 20;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  .info-banner {
    margin: 0 28px 4px; padding: 12px 18px;
    background: var(--accent-soft); border: 1px solid rgba(212,154,90,0.3);
    border-radius: 10px; display: flex; align-items: center; gap: 14px;
    font-family: 'Newsreader', serif; font-style: italic;
    font-size: 0.95rem; color: var(--ink); line-height: 1.55;
  }
  .info-banner.hidden { display: none; }
  .info-banner b { color: var(--accent); font-weight: 500; font-style: normal; }
  .info-banner code {
    background: var(--panel-2); border: 1px solid var(--line); padding: 1px 6px;
    border-radius: 4px; font-family: 'JetBrains Mono', monospace; font-style: normal;
    font-size: 0.78rem; color: var(--ink);
  }

  .ai-badge {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 6px 10px; border: 1px solid var(--line); border-radius: 7px;
    background: var(--panel-2); color: var(--ink-dim);
    font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.08em;
  }
  .ai-badge .dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--ink-dim); transition: background 0.2s;
  }
  .ai-badge.ok .dot { background: var(--green); }
  .ai-badge.warn .dot { background: var(--accent); }
  .ai-badge.err .dot { background: var(--red); }

  @media (max-width: 720px) {
    main { grid-template-columns: 1fr; grid-template-rows: 1fr 1fr; }
    .pane.left { border-right: none; border-bottom: 1px solid var(--line); }
    .info-banner { margin: 0 16px 4px; }
  }
</style>
</head>
<body>
  <header>
    <div class="brand">
      <h1>Summarizer<span class="dot">.</span></h1>
      <span class="sub">on-device &middot; no key, no login</span>
    </div>
    <div class="toolbar">
      <select id="style" title="Summary style">
        <option value="brief">Brief paragraph</option>
        <option value="bullets" selected>Key bullet points</option>
        <option value="tldr">TL;DR one-liner</option>
        <option value="detailed">Detailed outline</option>
        <option value="eli5">Explain simply</option>
      </select>
      <select id="length" title="Length">
        <option value="short">Short</option>
        <option value="medium" selected>Medium</option>
        <option value="long">Long</option>
      </select>
      <button class="primary" id="goBtn">Summarize</button>
      <button id="sampleBtn">Sample</button>
      <span class="ai-badge" id="aiBadge" title="Browser AI status"><span class="dot"></span><span id="aiBadgeText">Checking</span></span>
    </div>
  </header>

  <div class="info-banner hidden" id="infoBanner">
    <span id="bannerMsg"></span>
  </div>

  <main>
    <div class="pane left">
      <div class="pane-head">
        <span>Source text</span>
        <span style="display:flex;gap:6px;">
          <button class="small-btn" id="pasteBtn">Paste</button>
          <button class="small-btn" id="clearBtn">Clear</button>
        </span>
      </div>
      <input class="focus-input" id="focus" placeholder="Focus on&hellip; (optional &mdash; e.g. risks, action items, technical details)" spellcheck="false">
      <textarea id="input" placeholder="Paste an article, transcript, notes, or any long text&hellip;" spellcheck="false"></textarea>
    </div>
    <div class="pane">
      <div class="pane-head">
        <span>Summary</span>
        <button class="small-btn" id="copyBtn">Copy</button>
      </div>
      <div class="output" id="output"><span class="empty-state">Your summary will appear here.</span></div>
    </div>
  </main>

  <footer>
    <span class="stat">Words in: <b id="inWords">0</b></span>
    <span class="stat" id="status">Ready</span>
    <span class="reduction" id="reduction"></span>
  </footer>

  <div class="toast" id="toast"></div>

<script>
  const $ = id => document.getElementById(id);
  const input = $('input'), output = $('output'), toast = $('toast');
  let lastSummaryText = '';
  let currentSummarizer = null;

  function showToast(m){ toast.textContent = m; toast.classList.add('show'); setTimeout(()=>toast.classList.remove('show'),1500); }
  function wordCount(t){ return t.trim() ? t.trim().split(/\s+/).length : 0; }
  function updateInWords(){ $('inWords').textContent = wordCount(input.value); }
  input.addEventListener('input', updateInWords);

  function setStatus(text, cls){
    $('status').textContent = text;
    $('status').className = 'stat' + (cls ? ' ' + cls : '');
  }
  function setBadge(text, cls){
    $('aiBadgeText').textContent = text;
    $('aiBadge').className = 'ai-badge' + (cls ? ' ' + cls : '');
  }
  function showBanner(html){
    $('bannerMsg').innerHTML = html;
    $('infoBanner').classList.remove('hidden');
  }
  function hideBanner(){ $('infoBanner').classList.add('hidden'); }

  // Map UI style -> Summarizer API type + per-call context steering
  const STYLE_TYPE = {
    brief:    'teaser',
    bullets:  'key-points',
    tldr:     'tldr',
    detailed: 'key-points',
    eli5:     'key-points'
  };
  const STYLE_CONTEXT = {
    brief:    'Capture the main argument as a clear connected paragraph.',
    bullets:  'Focus on the most important, non-redundant takeaways.',
    tldr:     'Capture the absolute core in one punchy sentence.',
    detailed: 'Be thorough and structured: main themes, key details, conclusions.',
    eli5:     'Explain in plain, simple language for a curious beginner. Avoid jargon. Use short sentences.'
  };

  // ---- Browser-AI support detection ----
  async function checkSupport() {
    if (typeof self === 'undefined' || !('Summarizer' in self)) {
      return { ok: false, reason: 'unsupported' };
    }
    try {
      const availability = await Summarizer.availability();
      return { ok: availability !== 'unavailable', availability };
    } catch (e) {
      return { ok: false, reason: 'error', error: e.message || String(e) };
    }
  }

  (async function init() {
    setBadge('Checking', 'warn');
    const support = await checkSupport();
    if (!support.ok) {
      setBadge('Unavailable', 'err');
      setStatus('⚠ Browser AI unavailable', 'status-err');
      $('goBtn').disabled = true;
      showBanner(
        "This page uses your <b>browser's built-in AI</b> &mdash; no API key, no login, nothing leaves your device. " +
        "It looks like it isn't available here. Try <b>Chrome 138+</b> (or a recent Edge) on desktop with enough free disk for the on-device model. " +
        "On Chrome you may need to enable <code>chrome://flags/#summarization-api-for-gemini-nano</code> on older builds."
      );
      return;
    }
    if (support.availability === 'downloadable') {
      setBadge('Will download', 'warn');
      setStatus('Ready — model downloads on first run', '');
      showBanner("First run will download the on-device summarization model (a few hundred MB). It's stored by Chrome and reused after that. No network calls during summarization.");
    } else if (support.availability === 'downloading') {
      setBadge('Downloading', 'warn');
      setStatus('Model downloading…', '');
    } else {
      setBadge('Ready', 'ok');
      setStatus('Ready', 'status-ok');
    }
  })();

  // ---- Rendering ----
  function renderSummary(text, style) {
    const lines = text.split('\n').map(l => l.trim()).filter(l => l.length);
    let html = '';
    let inList = false;
    const closeList = () => { if (inList) { html += '</ul>'; inList = false; } };

    lines.forEach(line => {
      let m;
      if ((m = line.match(/^#{1,4}\s+(.*)$/))) { closeList(); html += '<h3>' + esc(m[1]) + '</h3>'; return; }
      if (/^tl;?dr[:\s-]/i.test(line)) {
        closeList();
        html += '<div class="tldr">' + esc(line.replace(/^tl;?dr[:\s-]*/i,'')) + '</div>';
        return;
      }
      if (/^[-*•]\s+/.test(line)) {
        if (!inList) { html += '<ul>'; inList = true; }
        html += '<li>' + inline(line.replace(/^[-*•]\s+/,'')) + '</li>';
        return;
      }
      if ((m = line.match(/^\*\*(.+?)\*\*:?\s*$/))) { closeList(); html += '<h3>' + esc(m[1]) + '</h3>'; return; }
      closeList();
      html += '<p>' + inline(line) + '</p>';
    });
    closeList();
    return html;
  }
  function esc(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
  function inline(s){
    return esc(s)
      .replace(/\*\*(.+?)\*\*/g, '<strong style="color:var(--ink);font-weight:600;">$1</strong>')
      .replace(/\*(.+?)\*/g, '<em>$1</em>');
  }

  // ---- Summarize ----
  async function summarize() {
    const text = input.value.trim();
    if (!text) { showToast('Paste some text first'); return; }
    if (wordCount(text) < 8) { showToast('Need a bit more text'); return; }

    const support = await checkSupport();
    if (!support.ok) {
      output.innerHTML = '<span class="empty-state" style="color:var(--red)">Browser AI is not available. Use Chrome 138+ on a supported device.</span>';
      setStatus('✗ Unsupported', 'status-err');
      return;
    }

    const style  = $('style').value;
    const length = $('length').value;
    const focus  = $('focus').value.trim();

    $('goBtn').disabled = true;
    setStatus('Preparing…', '');
    $('reduction').textContent = '';
    output.innerHTML =
      '<div class="thinking">Reading and distilling</div>' +
      '<div class="loading">' +
        '<div class="shimmer" style="width:90%"></div>' +
        '<div class="shimmer" style="width:75%"></div>' +
        '<div class="shimmer" style="width:85%"></div>' +
      '</div>';

    try {
      // 'detailed' wants long output regardless of slider; 'tldr' wants short.
      const effectiveLength =
        style === 'detailed' ? 'long' :
        style === 'tldr'     ? 'short' :
        length;

      const sharedContext = STYLE_CONTEXT[style] || '';
      const perCallContext = focus ? ('The reader specifically wants emphasis on: ' + focus + '.') : '';

      currentSummarizer = await Summarizer.create({
        type: STYLE_TYPE[style],
        length: effectiveLength,
        format: 'markdown',
        sharedContext,
        monitor(m) {
          m.addEventListener('downloadprogress', e => {
            const pct = Math.round((e.loaded || 0) * 100);
            setBadge('Downloading ' + pct + '%', 'warn');
            setStatus('⬇ Downloading on-device model… ' + pct + '%', '');
          });
        }
      });

      setBadge('Ready', 'ok');
      setStatus('Writing…', '');
      hideBanner();

      let summary = '';
      const stream = currentSummarizer.summarizeStreaming(text, perCallContext ? { context: perCallContext } : undefined);

      for await (const chunk of stream) {
        summary += chunk;
        output.innerHTML = renderSummary(summary, style) + '<span class="cursor">▍</span>';
        output.scrollTop = output.scrollHeight;
      }

      try { currentSummarizer.destroy && currentSummarizer.destroy(); } catch(e){}
      currentSummarizer = null;

      summary = summary.trim().replace(/^```[a-z]*\n?/i, '').replace(/```$/, '').trim();
      if (!summary) throw new Error('Empty response from on-device model');
      lastSummaryText = summary;
      output.innerHTML = renderSummary(summary, style);

      const inW = wordCount(text), outW = wordCount(summary);
      const pct = inW ? Math.round((1 - outW / inW) * 100) : 0;
      setStatus('✓ Done', 'status-ok');
      $('reduction').textContent = outW + ' words · ' + (pct > 0 ? pct + '% shorter' : 'condensed');
    } catch (e) {
      const msg = e.message || String(e);
      let hint = '';
      if (/quota|memory|allocation|resource/i.test(msg)) {
        hint = ' — the on-device model needs more memory or disk than is currently available.';
      } else if (/download|network|fetch/i.test(msg)) {
        hint = ' — model download failed. Check connection and try again.';
      } else if (/language|locale|english|supported/i.test(msg)) {
        hint = " — the on-device summarizer may not support this language yet.";
      } else if (/NotAllowed|permission/i.test(msg)) {
        hint = ' — the browser blocked the request. Enable on-device AI in your browser settings.';
      }
      output.innerHTML = '<span class="empty-state" style="color:var(--red)">Could not summarize: ' + esc(msg) + hint + '</span>';
      setStatus('✗ Error', 'status-err');
    } finally {
      $('goBtn').disabled = false;
    }
  }

  $('goBtn').addEventListener('click', summarize);
  $('clearBtn').addEventListener('click', () => {
    input.value=''; $('focus').value=''; updateInWords();
    output.innerHTML='<span class="empty-state">Your summary will appear here.</span>';
    setStatus('Ready'); $('reduction').textContent='';
    input.focus();
  });
  $('pasteBtn').addEventListener('click', async () => {
    try { const t = await navigator.clipboard.readText(); input.value = t; updateInWords(); showToast('Pasted'); }
    catch { showToast('Clipboard blocked — paste manually'); }
  });
  $('copyBtn').addEventListener('click', async () => {
    if (!lastSummaryText) { showToast('Nothing to copy'); return; }
    try { await navigator.clipboard.writeText(lastSummaryText); showToast('Copied summary'); }
    catch { showToast('Copy failed'); }
  });
  $('sampleBtn').addEventListener('click', () => {
    input.value = "Large language models have rapidly moved from research curiosities to everyday tools. Early systems could only complete short passages of text, but modern models handle reasoning, coding, translation, and multi-step planning. Their capabilities come from training on vast text corpora and scaling up both parameters and compute. However, this scale brings challenges: the models can produce confident-sounding errors, reflect biases present in their training data, and demand significant energy to run. Researchers are now focused on making models more reliable through techniques like reinforcement learning from human feedback, retrieval augmentation that grounds answers in external documents, and smaller distilled models that run efficiently on consumer hardware. The trajectory suggests AI assistants will become more specialized, more verifiable, and more tightly integrated into existing software rather than existing as standalone chatbots. For developers, the practical takeaway is that prompt design, evaluation, and guardrails now matter as much as raw model choice.";
    updateInWords();
    summarize();
  });

  updateInWords();
  input.focus();
</script>
</body>
</html>
