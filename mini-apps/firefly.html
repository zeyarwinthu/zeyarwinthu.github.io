<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Firefly</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
<style>
  :root {
    --sky-top: #0a0418; --sky-bottom: #2a1a4a;
    --panel: rgba(20,10,38,0.78); --ink: #fff; --accent: #d6ff5e;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
  html, body { height: 100%; overflow: hidden; }
  body {
    background: #07041a; color: var(--ink); font-family: 'Fredoka', sans-serif;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    min-height: 100vh; padding: 16px; gap: 14px;
  }
  h1 { font-weight: 700; font-size: clamp(1.5rem, 5vw, 2rem); letter-spacing: -0.01em; }
  h1 span { color: var(--accent); }

  .game-wrap { position: relative; }
  canvas {
    border-radius: 18px; display: block; touch-action: manipulation;
    box-shadow: 0 24px 60px -18px rgba(0,0,0,0.7); cursor: pointer;
  }

  /* ---- Overlays ---- */
  .overlay {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 14px; text-align: center;
    border-radius: 18px; padding: 24px; transition: opacity 0.25s;
  }
  .overlay.hidden { opacity: 0; pointer-events: none; }
  .overlay h2 { font-weight: 700; font-size: 1.9rem; text-shadow: 0 2px 0 rgba(0,0,0,0.25); }
  .overlay p { font-size: 0.9rem; opacity: 0.92; line-height: 1.5; max-width: 220px; }
  .scorecard {
    background: var(--panel); backdrop-filter: blur(6px); border-radius: 16px;
    padding: 16px 28px; font-family: 'JetBrains Mono', monospace; display: flex; gap: 26px;
  }
  .scorecard .item { text-align: center; }
  .scorecard .lbl { font-size: 0.6rem; letter-spacing: 0.15em; text-transform: uppercase; opacity: 0.7; }
  .scorecard .num { font-size: 1.8rem; }
  .scorecard .num.best { color: var(--accent); }
  .btn {
    background: var(--accent); color: #2a3500; border: none; border-radius: 14px;
    padding: 13px 40px; font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 1.1rem;
    cursor: pointer; transition: transform 0.12s; box-shadow: 0 5px 0 #9ec440;
  }
  .btn:hover { transform: translateY(-1px); }
  .btn:active { transform: translateY(3px); box-shadow: 0 2px 0 #9ec440; }

  .live-score {
    position: absolute; top: 22px; left: 50%; transform: translateX(-50%);
    font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 2.6rem;
    text-shadow: 0 3px 0 rgba(0,0,0,0.28); pointer-events: none; z-index: 3;
    opacity: 0; transition: opacity 0.2s;
  }
  .live-score.show { opacity: 1; }

  .hint { font-family: 'JetBrains Mono', monospace; font-size: 0.7rem; opacity: 0.55; }

  .mute-btn {
    position: absolute; top: 14px; right: 14px;
    width: 38px; height: 38px; padding: 0;
    background: rgba(20,10,38,0.6); backdrop-filter: blur(6px);
    color: var(--ink); border: none; border-radius: 50%;
    cursor: pointer; z-index: 4;
    display: flex; align-items: center; justify-content: center;
    transition: transform 0.12s, background 0.15s;
  }
  .mute-btn:hover { background: rgba(50,30,80,0.8); }
  .mute-btn:active { transform: scale(0.9); }
  .mute-btn svg { display: block; }
</style>
</head>
<body>
  <h1>Flicker <span>Firefly</span></h1>

  <div class="game-wrap">
    <canvas id="game"></canvas>
    <div class="live-score" id="liveScore">0</div>

    <button class="mute-btn" id="muteBtn" aria-label="Toggle sound">
      <svg id="muteIcon" viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
        <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4zm-2.5-9v2.06a7 7 0 0 1 0 13.87V21a9 9 0 0 0 0-18z"/>
      </svg>
    </button>

    <div class="overlay" id="startOverlay">
      <h2>✨ Firefly</h2>
      <p>Tap, click, or press Space to flutter. Glide through the gaps — don't touch the flames!</p>
      <button class="btn" id="startBtn">Play</button>
    </div>

    <div class="overlay hidden" id="overOverlay" style="background:rgba(11,22,32,0.55)">
      <h2>Game Over</h2>
      <div class="scorecard">
        <div class="item"><div class="lbl">Score</div><div class="num" id="finalScore">0</div></div>
        <div class="item"><div class="lbl">Best</div><div class="num best" id="bestScore">0</div></div>
      </div>
      <button class="btn" id="retryBtn">Play Again</button>
    </div>
  </div>

  <div class="hint">Space / Click / Tap to flutter</div>

<script>
(function(){
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const liveScore = document.getElementById('liveScore');

  // ---- Sizing (portrait playfield) ----
  let W, H;
  function size() {
    const availH = window.innerHeight - 110;
    const availW = window.innerWidth - 32;
    if (availW > availH) {
      // Landscape (desktop/laptop) — fill viewport
      W = canvas.width = Math.round(availW);
      H = canvas.height = Math.round(availH);
    } else {
      // Portrait (mobile) — keep 2:3 aspect
      let h = availH, w = h * 0.66;
      if (w > availW) { w = availW; h = w / 0.66; }
      W = canvas.width = Math.round(w);
      H = canvas.height = Math.round(h);
    }
  }
  size();
  window.addEventListener('resize', () => { size(); if (state!=='play') drawStatic(); });

  // ---- Game constants (scaled to height) ----
  let GRAV, FLAP, PIPE_W, GAP, SPEED, BIRD_R;
  function scaleConsts() {
    GRAV = H * 0.0011;
    FLAP = -H * 0.0125;
    PIPE_W = H * 0.105;
    GAP = H * 0.26;
    SPEED = H * 0.004;
    BIRD_R = H * 0.030;
  }
  scaleConsts();

  // ---- State ----
  let state = 'menu'; // menu | play | over
  const BEST_KEY = 'firefly-best-score';
  let bird, pipes, score, best = parseInt(localStorage.getItem(BEST_KEY), 10) || 0, frame, groundX = 0;
  let wingPhase = 0;

  function reset() {
    scaleConsts();
    bird = { x: W*0.28, y: H*0.45, v: 0, rot: 0 };
    pipes = [];
    score = 0; frame = 0;
    liveScore.textContent = '0';
    spawnPipe(W + 60);
    spawnPipe(W + 60 + pipeSpacing());
  }
  function pipeSpacing() { return H * 0.42; }

  function spawnPipe(x) {
    const margin = H * 0.12;
    const gapY = margin + Math.random() * (H - GAP - margin*2 - H*0.12); // leave room for ground
    pipes.push({ x, gapY, scored: false });
  }

  function flap() {
    initAudio();
    if (state === 'menu') { start(); return; }
    if (state === 'over') return;
    bird.v = FLAP;
    playFlap();
  }

  // ---- Loop ----
  function update() {
    frame++;
    bird.v += GRAV;
    bird.y += bird.v;
    bird.rot = Math.max(-0.5, Math.min(1.4, bird.v * 0.08));

    // move pipes
    pipes.forEach(p => p.x -= SPEED);
    // spawn / recycle
    if (pipes.length && pipes[pipes.length-1].x < W - pipeSpacing()) {
      spawnPipe(pipes[pipes.length-1].x + pipeSpacing());
    }
    pipes = pipes.filter(p => p.x + PIPE_W > -10);

    // scoring + collision
    const groundY = H - H*0.10;
    for (const p of pipes) {
      // score when bird passes pipe center
      if (!p.scored && p.x + PIPE_W < bird.x) {
        p.scored = true; score++; liveScore.textContent = score;
        playScore();
      }
      // collision with pipe
      if (bird.x + BIRD_R > p.x && bird.x - BIRD_R < p.x + PIPE_W) {
        if (bird.y - BIRD_R < p.gapY || bird.y + BIRD_R > p.gapY + GAP) {
          return gameOver();
        }
      }
    }
    // ground / ceiling
    if (bird.y + BIRD_R > groundY) { bird.y = groundY - BIRD_R; return gameOver(); }
    if (bird.y - BIRD_R < 0) { bird.y = BIRD_R; bird.v = 0; }

    groundX = (groundX - SPEED) % (W*0.1);
  }

  // ---- Render ----
  function drawBackground() {
    const g = ctx.createLinearGradient(0,0,0,H);
    g.addColorStop(0, '#08031f');
    g.addColorStop(0.5, '#1a0f3a');
    g.addColorStop(1, '#2b1845');
    ctx.fillStyle = g; ctx.fillRect(0,0,W,H);

    // Moon (top right)
    const moonX = W*0.82, moonY = H*0.15, moonR = W*0.055;
    const moonGlow = ctx.createRadialGradient(moonX, moonY, moonR*0.6, moonX, moonY, moonR*2.5);
    moonGlow.addColorStop(0, 'rgba(245,235,210,0.4)');
    moonGlow.addColorStop(1, 'rgba(245,235,210,0)');
    ctx.fillStyle = moonGlow;
    ctx.beginPath(); ctx.arc(moonX, moonY, moonR*2.5, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#f3ead0';
    ctx.beginPath(); ctx.arc(moonX, moonY, moonR, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = 'rgba(200,190,170,0.5)';
    ctx.beginPath(); ctx.arc(moonX+moonR*0.3, moonY-moonR*0.1, moonR*0.18, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(moonX-moonR*0.25, moonY+moonR*0.3, moonR*0.12, 0, Math.PI*2); ctx.fill();

    // Stars (twinkling)
    for (let i = 0; i < 45; i++) {
      const sx = (i * 71 + 13) % W;
      const sy = (i * 41 + 7) % (H * 0.82);
      const twinkle = 0.4 + 0.6 * (0.5 + Math.sin(frame*0.04 + i*1.3) * 0.5);
      const r = (i % 5 === 0) ? 1.6 : (i % 3 === 0 ? 1.1 : 0.7);
      ctx.fillStyle = `rgba(255,255,255,${twinkle})`;
      ctx.beginPath(); ctx.arc(sx, sy, r, 0, Math.PI*2); ctx.fill();
    }

    // Distant drifting fireflies (decorative, parallax background)
    for (let i = 0; i < 4; i++) {
      const fx = ((W*0.25*i - frame*0.3) % (W+60) + W+60) % (W+60) - 30;
      const fy = H*0.30 + i*H*0.13 + Math.sin(frame*0.03 + i)*H*0.02;
      const fr = W*0.012;
      const fg = ctx.createRadialGradient(fx, fy, 0, fx, fy, fr*4);
      fg.addColorStop(0, 'rgba(220,255,120,0.7)');
      fg.addColorStop(1, 'rgba(180,255,80,0)');
      ctx.fillStyle = fg;
      ctx.beginPath(); ctx.arc(fx, fy, fr*4, 0, Math.PI*2); ctx.fill();
    }
  }
  function drawFlames() {
    pipes.forEach((p, idx) => {
      // top flame column (tip points down toward gap)
      drawFlameColumn(p.x, 0, PIPE_W, p.gapY, true, idx);
      // bottom flame column (tip points up toward gap)
      const by = p.gapY + GAP;
      drawFlameColumn(p.x, by, PIPE_W, H - by, false, idx);
    });
  }
  function drawFlameColumn(x, y, w, h, isTop, seed) {
    const baseY = isTop ? y : y + h;
    const tipY  = isTop ? y + h : y;
    const dir   = isTop ? 1 : -1;

    // Outer glow halo around the column
    ctx.save();
    const haloGrd = ctx.createLinearGradient(x, baseY, x, tipY);
    haloGrd.addColorStop(0, 'rgba(255,80,30,0)');
    haloGrd.addColorStop(0.7, 'rgba(255,140,40,0.18)');
    haloGrd.addColorStop(1, 'rgba(255,210,80,0.32)');
    ctx.fillStyle = haloGrd;
    ctx.fillRect(x - w*0.35, Math.min(baseY, tipY), w*1.7, h);
    ctx.restore();

    // Main column gradient: fades from transparent base → bright yellow tip
    const grd = ctx.createLinearGradient(0, baseY, 0, tipY);
    grd.addColorStop(0,    'rgba(42,2,2,0)');
    grd.addColorStop(0.25, 'rgba(120,18,0,0.35)');
    grd.addColorStop(0.55, 'rgba(226,58,8,0.95)');
    grd.addColorStop(0.82, '#ffa324');
    grd.addColorStop(1,    '#ffeb6b');
    ctx.fillStyle = grd;

    ctx.beginPath();
    ctx.moveTo(x, baseY);
    ctx.lineTo(x + w, baseY);

    // wavy right edge from base up toward tip
    const segs = 5;
    for (let i = 1; i <= segs; i++) {
      const t = i/segs;
      const sy = baseY + (tipY - baseY) * t;
      const wave = Math.sin(frame*0.13 + i*1.4 + seed*1.7) * w*0.05 * t;
      ctx.lineTo(x + w + wave, sy);
    }

    // flame tongues at tip (3 licks)
    const tongue = (offset, baseLen, vary) =>
      tipY + dir * (baseLen + Math.sin(frame*0.22 + seed + offset) * vary) * w;
    const valleyY = tipY - dir * w*0.08;
    ctx.quadraticCurveTo(x + w*0.88, valleyY, x + w*0.75, tongue(0.0, 0.32, 0.18));
    ctx.quadraticCurveTo(x + w*0.62, valleyY, x + w*0.50, tongue(1.1, 0.58, 0.22));
    ctx.quadraticCurveTo(x + w*0.38, valleyY, x + w*0.25, tongue(2.3, 0.30, 0.16));
    ctx.quadraticCurveTo(x + w*0.12, valleyY, x, tongue(3.5, 0.18, 0.12));

    // wavy left edge back down to base
    for (let i = segs; i >= 1; i--) {
      const t = i/segs;
      const sy = baseY + (tipY - baseY) * t;
      const wave = Math.sin(frame*0.13 + i*1.8 + seed*2.1 + 2) * w*0.05 * t;
      ctx.lineTo(x - wave, sy);
    }
    ctx.closePath();
    ctx.fill();

    // Hot inner core (additive bright streak)
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    const coreGrd = ctx.createLinearGradient(0, baseY, 0, tipY);
    coreGrd.addColorStop(0,    'rgba(255,80,0,0)');
    coreGrd.addColorStop(0.5,  'rgba(255,180,60,0.22)');
    coreGrd.addColorStop(0.9,  'rgba(255,240,180,0.45)');
    coreGrd.addColorStop(1,    'rgba(255,255,220,0.6)');
    ctx.fillStyle = coreGrd;
    ctx.fillRect(x + w*0.28, Math.min(baseY, tipY), w*0.44, h);
    ctx.restore();

    // tiny ember sparks rising off the tip
    ctx.fillStyle = 'rgba(255,220,140,0.85)';
    for (let i = 0; i < 3; i++) {
      const ex = x + w*(0.25 + i*0.25) + Math.sin(frame*0.2 + i + seed)*w*0.06;
      const ey = tipY + dir * (w*0.7 + ((frame*2 + i*40 + seed*30) % (w*1.2)));
      const er = w*0.025;
      ctx.beginPath(); ctx.arc(ex, ey, er, 0, Math.PI*2); ctx.fill();
    }
  }
  function roundRectPath(x,y,w,h,r){
    r = Math.min(r, w/2, h/2);
    ctx.beginPath();
    ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
    ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath();
  }
  function drawGround() {
    const gy = H - H*0.10;
    ctx.fillStyle = '#ded895'; ctx.fillRect(0, gy, W, H*0.10);
    ctx.fillStyle = '#c8b86a';
    for (let x = groundX; x < W; x += W*0.1) {
      ctx.fillRect(x, gy, W*0.05, H*0.10);
    }
    ctx.fillStyle = '#8bc34a'; ctx.fillRect(0, gy, W, H*0.012);
  }
  function drawFirefly() {
    ctx.save();
    ctx.translate(bird.x, bird.y);
    ctx.rotate(bird.rot);
    const r = BIRD_R;

    // Pulsing outer glow halo behind the abdomen
    const pulse = 0.85 + 0.15 * Math.sin(frame * 0.2);
    const tailX = -r * 0.85;
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    const halo = ctx.createRadialGradient(tailX, 0, 0, tailX, 0, r * 3.2 * pulse);
    halo.addColorStop(0, 'rgba(235,255,140,0.75)');
    halo.addColorStop(0.45, 'rgba(200,255,90,0.28)');
    halo.addColorStop(1, 'rgba(150,255,40,0)');
    ctx.fillStyle = halo;
    ctx.beginPath(); ctx.arc(tailX, 0, r * 3.2 * pulse, 0, Math.PI * 2); ctx.fill();
    ctx.restore();

    // Body (dark, segmented oval)
    ctx.fillStyle = '#2a1d12';
    ctx.beginPath(); ctx.ellipse(0, 0, r * 1.1, r * 0.55, 0, 0, Math.PI * 2); ctx.fill();
    // segment stripes
    ctx.fillStyle = '#150d05';
    ctx.beginPath(); ctx.ellipse(-r * 0.25, 0, r * 0.07, r * 0.5, 0, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(-r * 0.55, 0, r * 0.07, r * 0.42, 0, 0, Math.PI * 2); ctx.fill();

    // Head (small dome on the right)
    ctx.fillStyle = '#1a1108';
    ctx.beginPath(); ctx.ellipse(r * 0.85, 0, r * 0.4, r * 0.42, 0, 0, Math.PI * 2); ctx.fill();
    // eye
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(r * 1.0, -r * 0.18, r * 0.12, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#000';
    ctx.beginPath(); ctx.arc(r * 1.04, -r * 0.18, r * 0.06, 0, Math.PI * 2); ctx.fill();

    // Antennae
    ctx.strokeStyle = '#1a1108';
    ctx.lineWidth = Math.max(1, r * 0.07);
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(r * 1.05, -r * 0.32);
    ctx.quadraticCurveTo(r * 1.35, -r * 0.75, r * 1.5, -r * 0.9);
    ctx.moveTo(r * 1.15, -r * 0.22);
    ctx.quadraticCurveTo(r * 1.5, -r * 0.55, r * 1.7, -r * 0.6);
    ctx.stroke();
    // antenna tips
    ctx.fillStyle = '#1a1108';
    ctx.beginPath(); ctx.arc(r * 1.5, -r * 0.9, r * 0.06, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(r * 1.7, -r * 0.6, r * 0.06, 0, Math.PI * 2); ctx.fill();

    // Wings (translucent, fluttering)
    const wingFlap = Math.sin(wingPhase) * 0.5;
    ctx.save();
    ctx.globalAlpha = 0.5;
    ctx.fillStyle = '#eaf2ff';
    // back wing
    ctx.save();
    ctx.translate(-r * 0.05, -r * 0.25);
    ctx.rotate(0.15 + wingFlap * 0.6);
    ctx.beginPath(); ctx.ellipse(0, -r * 0.4, r * 0.75, r * 0.32, 0, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
    // front wing
    ctx.save();
    ctx.translate(r * 0.15, -r * 0.3);
    ctx.rotate(-0.2 + wingFlap * 0.5);
    ctx.beginPath(); ctx.ellipse(0, -r * 0.4, r * 0.7, r * 0.3, 0, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
    ctx.restore();

    // Bright abdomen tip (light source)
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    const tip = ctx.createRadialGradient(tailX, 0, 0, tailX, 0, r * 0.7);
    tip.addColorStop(0, 'rgba(255,255,230,1)');
    tip.addColorStop(0.4, 'rgba(225,255,130,0.9)');
    tip.addColorStop(1, 'rgba(180,255,80,0)');
    ctx.fillStyle = tip;
    ctx.beginPath(); ctx.arc(tailX, 0, r * 0.7, 0, Math.PI * 2); ctx.fill();
    ctx.restore();

    ctx.restore();
  }

  function render() {
    drawBackground();
    drawFlames();
    drawGround();
    drawFirefly();
  }
  function drawStatic() {
    reset();
    render();
  }

  function frameLoop() {
    if (state === 'play') {
      wingPhase += 0.3;
      update();
      if (state === 'play') render();
    }
    requestAnimationFrame(frameLoop);
  }

  // ---- Flow ----
  function start() {
    initAudio();
    reset();
    state = 'play';
    document.getElementById('startOverlay').classList.add('hidden');
    document.getElementById('overOverlay').classList.add('hidden');
    liveScore.classList.add('show');
  }
  function gameOver() {
    if (state !== 'play') return;
    state = 'over';
    playHit();
    if (score > best) { best = score; try { localStorage.setItem(BEST_KEY, best); } catch(e) {} }
    liveScore.classList.remove('show');
    document.getElementById('finalScore').textContent = score;
    document.getElementById('bestScore').textContent = best;
    // brief flash
    ctx.fillStyle = 'rgba(255,255,255,0.6)'; ctx.fillRect(0,0,W,H);
    setTimeout(() => document.getElementById('overOverlay').classList.remove('hidden'), 250);
  }

  // ---- Audio (calm ambient pad + soft SFX) ----
  let audioCtx = null, masterGain = null, muted = false;
  const AMBIENT_VOL = 0.22;

  function initAudio() {
    if (audioCtx) return;
    try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
    catch(e) { return; }
    masterGain = audioCtx.createGain();
    masterGain.gain.value = 0;
    masterGain.connect(audioCtx.destination);
    startAmbient();
    masterGain.gain.linearRampToValueAtTime(muted ? 0 : AMBIENT_VOL, audioCtx.currentTime + 2.5);
  }

  function startAmbient() {
    scheduleTwinkles();
  }

  // Random soft "twinkle" chimes — C major pentatonic in upper octaves
  const TWINKLE_NOTES = [523.25, 587.33, 659.25, 783.99, 880.00, 1046.50, 1174.66];
  function scheduleTwinkles() {
    const play = () => {
      if (audioCtx && !muted) {
        const t = audioCtx.currentTime;
        const f = TWINKLE_NOTES[Math.floor(Math.random() * TWINKLE_NOTES.length)];
        const osc = audioCtx.createOscillator(), g = audioCtx.createGain();
        osc.type = 'sine'; osc.frequency.value = f;
        g.gain.setValueAtTime(0, t);
        g.gain.linearRampToValueAtTime(0.05, t + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, t + 1.4);
        osc.connect(g).connect(masterGain);
        osc.start(t); osc.stop(t + 1.5);
      }
      setTimeout(play, 400 + Math.random() * 900);
    };
    setTimeout(play, 500);
  }

  function playFlap() {
    if (!audioCtx || muted) return;
    const t = audioCtx.currentTime;
    const osc = audioCtx.createOscillator(), g = audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(900, t);
    osc.frequency.exponentialRampToValueAtTime(420, t + 0.09);
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(0.06, t + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.12);
    osc.connect(g).connect(audioCtx.destination);
    osc.start(t); osc.stop(t + 0.15);
  }

  function playScore() {
    if (!audioCtx || muted) return;
    const t = audioCtx.currentTime;
    [880, 1320].forEach((f, i) => {
      const osc = audioCtx.createOscillator(), g = audioCtx.createGain();
      osc.type = 'sine'; osc.frequency.value = f;
      g.gain.setValueAtTime(0, t + i*0.05);
      g.gain.linearRampToValueAtTime(0.05, t + 0.01 + i*0.05);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.4);
      osc.connect(g).connect(audioCtx.destination);
      osc.start(t + i*0.05); osc.stop(t + 0.5);
    });
  }

  function playHit() {
    if (!audioCtx || muted) return;
    const t = audioCtx.currentTime;
    const osc = audioCtx.createOscillator(), g = audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(180, t);
    osc.frequency.exponentialRampToValueAtTime(55, t + 0.4);
    g.gain.setValueAtTime(0.14, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.5);
    osc.connect(g).connect(audioCtx.destination);
    osc.start(t); osc.stop(t + 0.5);
  }

  function toggleMute() {
    muted = !muted;
    if (!masterGain) return;
    masterGain.gain.cancelScheduledValues(audioCtx.currentTime);
    masterGain.gain.linearRampToValueAtTime(muted ? 0 : AMBIENT_VOL, audioCtx.currentTime + 0.3);
  }

  // ---- Input ----
  function onTap(e) { e.preventDefault(); flap(); }
  canvas.addEventListener('mousedown', onTap);
  canvas.addEventListener('touchstart', onTap, {passive:false});
  window.addEventListener('keydown', e => {
    if (e.code === 'Space' || e.code === 'ArrowUp') { e.preventDefault(); flap(); }
  });
  document.getElementById('startBtn').onclick = start;
  document.getElementById('retryBtn').onclick = start;

  const ICON_ON  = '<path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4zm-2.5-9v2.06a7 7 0 0 1 0 13.87V21a9 9 0 0 0 0-18z"/>';
  const ICON_OFF = '<path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.17v2.06a8.99 8.99 0 0 0 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/>';
  document.getElementById('muteBtn').onclick = (e) => {
    e.stopPropagation();
    initAudio();
    toggleMute();
    document.getElementById('muteIcon').innerHTML = muted ? ICON_OFF : ICON_ON;
  };

  // init
  drawStatic();
  frameLoop();
})();
</script>
</body>
</html>
