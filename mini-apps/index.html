<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mini Apps</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      padding: 48px 24px;
      font-family: Inter, system-ui, -apple-system, sans-serif;
      background: #ffffff;
      color: #0f172a;
    }
    .container {
      max-width: 1100px;
      margin: 0 auto;
    }
    header {
      text-align: center;
      margin-bottom: 48px;
    }
    h1 {
      margin: 0 0 12px;
      font-size: clamp(2rem, 4vw, 2.8rem);
      letter-spacing: -0.04em;
      color: #0f172a;
    }
    header p {
      margin: 0;
      color: #64748b;
      font-size: 1rem;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 32px 24px;
    }
    .card {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 24px 12px;
      text-decoration: none;
      color: #1e3a8a;
      border-radius: 12px;
      transition: transform 0.2s ease, background 0.2s ease;
    }
    .card:hover {
      transform: translateY(-4px);
      background: #f8fafc;
    }
    .card:hover .name {
      text-decoration: underline;
      text-underline-offset: 4px;
    }
    .thumb {
      width: 110px;
      height: 110px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 56px;
      margin-bottom: 16px;
      background: #ffffff;
    }
    .thumb svg { display: block; }
    .name {
      font-size: 0.98rem;
      font-weight: 500;
      color: #1e3a8a;
      letter-spacing: 0.01em;
    }
    @media (max-width: 480px) {
      body { padding: 32px 16px; }
      .grid { grid-template-columns: repeat(2, 1fr); gap: 24px 12px; }
      .thumb { width: 90px; height: 90px; font-size: 44px; }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Mini Apps</h1>
      <p>A small collection of browser experiments. Pick one to try.</p>
    </header>
    <div class="grid">
      <a class="card" href="memory-match.html">
        <div class="thumb">🧠</div>
        <div class="name">Memory Match</div>
      </a>
      <a class="card" href="tic-tac-toe.html">
        <div class="thumb">⭕</div>
        <div class="name">Tic-Tac-Toe</div>
      </a>
      <a class="card" href="tts.html">
        <div class="thumb">🔊</div>
        <div class="name">Text-to-Speech</div>
      </a>
      <a class="card" href="paint.html">
        <div class="thumb">🖌️</div>
        <div class="name">Paint</div>
      </a>
      <a class="card" href="palette.html">
        <div class="thumb">🎨</div>
        <div class="name">Palette</div>
      </a>
      <a class="card" href="qrcode.html">
        <div class="thumb">
          <svg viewBox="0 0 100 100" width="80" height="80" aria-hidden="true">
            <rect width="100" height="100" fill="#ffffff"/>
            <!-- Finder patterns (top-left, top-right, bottom-left) -->
            <g fill="#0f172a">
              <rect x="4"  y="4"  width="28" height="28"/>
              <rect x="68" y="4"  width="28" height="28"/>

            </g>

              <rect x="10" y="10" width="16" height="16"/>
              <rect x="74" y="10" width="16" height="16"/>
              <rect x="10" y="74" width="16" height="16"/>
            </g>
            <g fill="#0f172a">
              <rect x="14" y="14" width="8" height="8"/>
              <rect x="78" y="14" width="8" height="8"/>
              <rect x="14" y="78" width="8" height="8"/>
            </g>
            <!-- Data modules -->
            <g fill="#0f172a">
              <rect x="40" y="4"  width="6" height="6"/>
              <rect x="52" y="4"  width="6" height="6"/>
              <rect x="40" y="16" width="6" height="6"/>
              <rect x="46" y="22" width="6" height="6"/>
              <rect x="58" y="16" width="6" height="6"/>
              <rect x="4"  y="40" width="6" height="6"/>
              <rect x="16" y="40" width="6" height="6"/>
              <rect x="22" y="46" width="6" height="6"/>
              <rect x="4"  y="52" width="6" height="6"/>
              <rect x="16" y="58" width="6" height="6"/>
              <rect x="34" y="40" width="6" height="6"/>
              <rect x="40" y="46" width="6" height="6"/>
              <rect x="46" y="40" width="6" height="6"/>
              <rect x="52" y="46" width="6" height="6"/>
              <rect x="58" y="40" width="6" height="6"/>
              <rect x="40" y="58" width="6" height="6"/>
              <rect x="52" y="58" width="6" height="6"/>
              <rect x="34" y="52" width="6" height="6"/>
              <rect x="58" y="52" width="6" height="6"/>
              <rect x="70" y="40" width="6" height="6"/>
              <rect x="82" y="40" width="6" height="6"/>
              <rect x="76" y="46" width="6" height="6"/>
              <rect x="88" y="46" width="6" height="6"/>
              <rect x="70" y="52" width="6" height="6"/>
              <rect x="82" y="58" width="6" height="6"/>
              <rect x="40" y="70" width="6" height="6"/>
              <rect x="52" y="70" width="6" height="6"/>
              <rect x="46" y="76" width="6" height="6"/>
              <rect x="58" y="82" width="6" height="6"/>
              <rect x="40" y="88" width="6" height="6"/>
              <rect x="70" y="70" width="6" height="6"/>
              <rect x="82" y="70" width="6" height="6"/>
              <rect x="76" y="76" width="6" height="6"/>
              <rect x="88" y="82" width="6" height="6"/>
              <rect x="70" y="88" width="6" height="6"/>
            </g>
          </svg>
        </div>
        <div class="name">QR Code Generator</div>
      </a>
      <a class="card" href="snake.html">
        <div class="thumb">🐍</div>
        <div class="name">Snake</div>

      <a class="card" href="what-a-mole.html">

            <rect x="6"  y="6"  width="40" height="40" rx="6" fill="#efe6db"/>

      <a class="card" href="firefly.html">
        <div class="thumb">
          <svg viewBox="-60 -50 160 100" width="110" height="80" aria-hidden="true">
            <defs>
              <radialGradient id="ffHalo" cx="0" cy="0" r="1">
                <stop offset="0%"   stop-color="#ebff8c" stop-opacity="0.8"/>
                <stop offset="45%"  stop-color="#c8ff5a" stop-opacity="0.3"/>
                <stop offset="100%" stop-color="#96ff28" stop-opacity="0"/>
              </radialGradient>
              <radialGradient id="ffTip" cx="0" cy="0" r="1">
                <stop offset="0%"   stop-color="#ffffe6" stop-opacity="1"/>
                <stop offset="40%"  stop-color="#e1ff82" stop-opacity="0.95"/>
                <stop offset="100%" stop-color="#b4ff50" stop-opacity="0"/>
              </radialGradient>
            </defs>
            <!-- Glow halo behind tail -->
            <circle cx="-34" cy="0" r="45" fill="url(#ffHalo)"/>
            <!-- Wings (translucent) -->
            <ellipse cx="-4" cy="-26" rx="22" ry="10" fill="#eaf2ff" opacity="0.55" transform="rotate(-12 -4 -26)"/>
            <ellipse cx="8"  cy="-28" rx="20" ry="9"  fill="#eaf2ff" opacity="0.55" transform="rotate(-22 8 -28)"/>
            <!-- Body (dark segmented oval) -->
            <ellipse cx="0" cy="0" rx="32" ry="14" fill="#2a1d12"/>
            <ellipse cx="-8"  cy="0" rx="2" ry="12" fill="#150d05"/>
            <ellipse cx="-18" cy="0" rx="2" ry="10" fill="#150d05"/>
            <!-- Head -->
            <ellipse cx="28" cy="0" rx="11" ry="11" fill="#1a1108"/>
            <!-- Eye -->
            <circle cx="32" cy="-4" r="3.4" fill="#ffffff"/>
            <circle cx="33" cy="-4" r="1.7" fill="#000000"/>
            <!-- Antennae -->
            <path d="M 32 -8 Q 42 -19 46 -24" stroke="#1a1108" stroke-width="1.8" fill="none" stroke-linecap="round"/>
            <path d="M 35 -6 Q 46 -14 50 -16" stroke="#1a1108" stroke-width="1.8" fill="none" stroke-linecap="round"/>
            <circle cx="46" cy="-24" r="1.8" fill="#1a1108"/>
            <circle cx="50" cy="-16" r="1.8" fill="#1a1108"/>
            <!-- Bright abdomen tip -->
            <circle cx="-34" cy="0" r="14" fill="url(#ffTip)"/>
          </svg>
        </div>
        <div class="name">Firefly</div>
      </a>

</html>
