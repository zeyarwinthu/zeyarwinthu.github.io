<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tic-Tac-Toe</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,600;9..144,900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0e1116;
    --panel: #161b22;
    --line: #2a313c;
    --ink: #e8e6e1;
    --muted: #7d8590;
    --x: #ff6b5e;
    --o: #5ec8d8;
    --win: #f5c451;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: radial-gradient(circle at 50% 0%, #1a212c 0%, var(--bg) 60%);
    color: var(--ink);
    font-family: 'Space Mono', monospace;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px;
    gap: 28px;
  }
  header { text-align: center; }
  h1 {
    font-family: 'Fraunces', serif;
    font-weight: 900;
    font-size: clamp(2.4rem, 8vw, 4rem);
    letter-spacing: -0.02em;
    line-height: 0.95;
  }
  h1 span { color: var(--x); font-style: italic; }
  .sub { color: var(--muted); font-size: 0.8rem; margin-top: 8px; letter-spacing: 0.15em; text-transform: uppercase; }
 
  .status {
    font-size: 1.05rem;
    letter-spacing: 0.05em;
    min-height: 1.4em;
    transition: color 0.3s;
  }
 
  .board {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    background: var(--line);
    padding: 10px;
    border-radius: 18px;
    width: min(80vw, 300px);
    height: auto;
    box-shadow: 0 30px 60px -20px rgba(0,0,0,0.6);
  }
  .cell {
    aspect-ratio: 1;
    background: var(--panel);
    border: none;
    border-radius: 12px;
    font-family: 'Fraunces', serif;
    font-weight: 900;
    font-size: clamp(2rem, 10vw, 3rem);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.12s, background 0.2s;
    user-select: none;
  }
  .cell:hover:not(:disabled) { background: #1d242e; transform: translateY(-2px); }
  .cell:disabled { cursor: default; }
  .cell.x { color: var(--x); }
  .cell.o { color: var(--o); }
  .cell.win { background: rgba(245,196,81,0.12); color: var(--win); }
  @keyframes pop { 0% { transform: scale(0.4); opacity: 0; } 60% { transform: scale(1.12); } 100% { transform: scale(1); opacity: 1; } }
  .cell .mark { display: inline-block; animation: pop 0.25s ease-out; }
 
  .controls { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
  button.btn {
    background: var(--panel);
    color: var(--ink);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 10px 18px;
    font-family: 'Space Mono', monospace;
    font-size: 0.8rem;
    letter-spacing: 0.05em;
    cursor: pointer;
    transition: border-color 0.2s, background 0.2s;
  }
  button.btn:hover { border-color: var(--x); background: #1d242e; }
  button.btn.active { border-color: var(--o); color: var(--o); }
 
  .scoreboard {
    display: flex;
    gap: 28px;
    font-size: 0.85rem;
  }
  .score { text-align: center; }
  .score .label { color: var(--muted); font-size: 0.65rem; letter-spacing: 0.15em; text-transform: uppercase; }
  .score .val { font-family: 'Fraunces', serif; font-weight: 900; font-size: 1.8rem; }
  .score.you .val { color: var(--x); }
  .score.ai .val { color: var(--o); }
 
  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(8,10,14,0.78);
    backdrop-filter: blur(6px);
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s;
    z-index: 10;
  }
  .overlay.show { opacity: 1; pointer-events: auto; }
  .modal {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 20px;
    padding: 36px 32px;
    text-align: center;
    width: min(82vw, 320px);
    box-shadow: 0 40px 80px -20px rgba(0,0,0,0.7);
    transform: scale(0.85);
    transition: transform 0.28s cubic-bezier(.2,1.3,.4,1);
  }
  .overlay.show .modal { transform: scale(1); }
  .modal .emoji { font-size: 3rem; line-height: 1; }
  .modal h2 {
    font-family: 'Fraunces', serif;
    font-weight: 900;
    font-size: 2rem;
    margin: 14px 0 6px;
  }
  .modal p { color: var(--muted); font-size: 0.85rem; margin-bottom: 24px; }
  .modal button {
    background: var(--ink);
    color: var(--bg);
    border: none;
    border-radius: 10px;
    padding: 13px 28px;
    font-family: 'Space Mono', monospace;
    font-weight: 700;
    font-size: 0.9rem;
    letter-spacing: 0.05em;
    cursor: pointer;
    transition: transform 0.12s, opacity 0.2s;
  }
  .modal button:hover { transform: translateY(-2px); opacity: 0.9; }
</style>
</head>
<body>
  <header>
    <h1>TIC<span>·</span>TAC<span>·</span>TOE</h1>
    <div class="sub">You vs. the machine</div>
  </header>
 
  <div class="status" id="status">Your move — you're X</div>
 
  <div class="board" id="board"></div>
 
  <div class="scoreboard">
    <div class="score you"><div class="label">You</div><div class="val" id="sYou">0</div></div>
    <div class="score draw"><div class="label">Draw</div><div class="val" id="sDraw">0</div></div>
    <div class="score ai"><div class="label">AI</div><div class="val" id="sAI">0</div></div>
  </div>
 
  <div class="controls">
    <button class="btn" id="reset">New Round</button>
    <button class="btn active" data-diff="hard">Unbeatable</button>
  </div>
 
  <div class="overlay" id="overlay">
    <div class="modal">
      <div class="emoji" id="mEmoji">🎉</div>
      <h2 id="mTitle">You win!</h2>
      <p id="mSub">Nicely played.</p>
      <button id="mPlay">Play Again</button>
    </div>
  </div>
 
<script>
  const HUMAN = 'X', AI = 'O';
  let board = Array(9).fill('');
  let gameOver = false;
  let difficulty = 'hard';
  const scores = { you: 0, draw: 0, ai: 0 };
 
  const boardEl = document.getElementById('board');
  const statusEl = document.getElementById('status');
  const wins = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
 
  function render() {
    boardEl.innerHTML = '';
    board.forEach((v, i) => {
      const btn = document.createElement('button');
      btn.className = 'cell' + (v ? ' ' + v.toLowerCase() : '');
      btn.disabled = !!v || gameOver;
      if (v) btn.innerHTML = `<span class="mark">${v}</span>`;
      btn.onclick = () => move(i);
      btn.dataset.i = i;
      boardEl.appendChild(btn);
    });
  }
 
  function move(i) {
    if (board[i] || gameOver) return;
    board[i] = HUMAN;
    render();
    if (checkEnd()) return;
    statusEl.textContent = 'Thinking…';
    setTimeout(aiMove, 350);
  }
 
  function aiMove() {
    const i = bestMove();
    board[i] = AI;
    render();
    if (checkEnd()) return;
    statusEl.textContent = "Your move — you're X";
  }
 
  function bestMove() {
    let best = -Infinity, idx = 0;
    board.forEach((v, i) => {
      if (!v) {
        board[i] = AI;
        const score = minimax(board, 0, false);
        board[i] = '';
        if (score > best) { best = score; idx = i; }
      }
    });
    return idx;
  }
 
  function minimax(b, depth, isMax) {
    const w = winner(b);
    if (w === AI) return 10 - depth;
    if (w === HUMAN) return depth - 10;
    if (b.every(c => c)) return 0;
 
    if (isMax) {
      let best = -Infinity;
      for (let i = 0; i < 9; i++) if (!b[i]) { b[i]=AI; best=Math.max(best,minimax(b,depth+1,false)); b[i]=''; }
      return best;
    } else {
      let best = Infinity;
      for (let i = 0; i < 9; i++) if (!b[i]) { b[i]=HUMAN; best=Math.min(best,minimax(b,depth+1,true)); b[i]=''; }
      return best;
    }
  }
 
  function winner(b) {
    for (const [a,c,d] of wins) if (b[a] && b[a]===b[c] && b[a]===b[d]) return b[a];
    return null;
  }
 
  function winningLine(b) {
    for (const line of wins) { const [a,c,d]=line; if (b[a] && b[a]===b[c] && b[a]===b[d]) return line; }
    return null;
  }
 
  function showModal(emoji, title, sub) {
    document.getElementById('mEmoji').textContent = emoji;
    document.getElementById('mTitle').textContent = title;
    document.getElementById('mSub').textContent = sub;
    setTimeout(() => document.getElementById('overlay').classList.add('show'), 600);
  }
 
  function checkEnd() {
    const w = winner(board);
    if (w) {
      gameOver = true;
      const line = winningLine(board);
      [...boardEl.children].forEach(c => { if (line.includes(+c.dataset.i)) c.classList.add('win'); });
      if (w === HUMAN) { scores.you++; statusEl.textContent = 'You win! 🎉'; statusEl.style.color = 'var(--x)'; showModal('🎉', 'You win!', 'Nicely played.'); }
      else { scores.ai++; statusEl.textContent = 'AI wins.'; statusEl.style.color = 'var(--o)'; showModal('🤖', 'AI wins', 'The machine takes this one.'); }
      updateScores();
      return true;
    }
    if (board.every(c => c)) {
      gameOver = true;
      scores.draw++;
      statusEl.textContent = "Draw — nobody blinked.";
      statusEl.style.color = 'var(--muted)';
      showModal('🤝', 'Draw', 'Nobody blinked.');
      updateScores();
      return true;
    }
    return false;
  }
 
  function updateScores() {
    document.getElementById('sYou').textContent = scores.you;
    document.getElementById('sDraw').textContent = scores.draw;
    document.getElementById('sAI').textContent = scores.ai;
  }
 
  function reset() {
    document.getElementById('overlay').classList.remove('show');
    board = Array(9).fill('');
    gameOver = false;
    statusEl.textContent = "Your move — you're X";
    statusEl.style.color = 'var(--ink)';
    render();
  }
 
  document.getElementById('reset').onclick = reset;
  document.getElementById('mPlay').onclick = reset;
  document.querySelectorAll('[data-diff]').forEach(b => {
    b.onclick = () => {
      difficulty = b.dataset.diff;
      document.querySelectorAll('[data-diff]').forEach(x => x.classList.remove('active'));
      b.classList.add('active');
      reset();
    };
  });
 
  render();
</script>
</body>
</html>
