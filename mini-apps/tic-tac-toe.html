<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tic-Tac-Toe</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,600;9..144,900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0e1116;
    --panel: #161b22;
    --line: #2a313c;
    --ink: #e8e6e1;
    --muted: #7d8590;
    --x: #ff6b5e;
    --o: #5ec8d8;
    --win: #f5c451;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: radial-gradient(circle at 50% 0%, #1a212c 0%, var(--bg) 60%);
    color: var(--ink);
    font-family: 'Space Mono', monospace;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px;
    gap: 28px;
  }
  header { text-align: center; }
  h1 {
    font-family: 'Fraunces', serif;
    font-weight: 900;
    font-size: clamp(2.4rem, 8vw, 4rem);
    letter-spacing: -0.02em;
    line-height: 0.95;
  }
  h1 span { color: var(--x); font-style: italic; }
  .sub { color: var(--muted); font-size: 0.8rem; margin-top: 8px; letter-spacing: 0.15em; text-transform: uppercase; }

  .status {
    font-size: 1.05rem;
    letter-spacing: 0.05em;
    min-height: 1.4em;
    transition: color 0.3s;
  }

  .board {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    background: var(--line);
    padding: 10px;
    border-radius: 18px;
    width: min(80vw, 300px);
    height: auto;
    box-shadow: 0 30px 60px -20px rgba(0,0,0,0.6);
  }
  .cell {
    aspect-ratio: 1;
    background: var(--panel);
    border: none;
    border-radius: 12px;
    font-family: 'Fraunces', serif;
    font-weight: 900;
    font-size: clamp(2rem, 10vw, 3rem);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.12s, background 0.2s;
    user-select: none;
  }
  .cell:hover:not(:disabled) { background: #1d242e; transform: translateY(-2px); }
  .cell:disabled { cursor: default; }
  .cell.x { color: var(--x); }
  .cell.o { color: var(--o); }
  .cell.win { background: rgba(245,196,81,0.12); color: var(--win); }
  @keyframes pop { 0% { transform: scale(0.4); opacity: 0; } 60% { transform: scale(1.12); } 100% { transform: scale(1); opacity: 1; } }
  .cell .mark { display: inline-block; animation: pop 0.25s ease-out; }

  .controls { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
  button.btn {
    background: var(--panel);
    color: var(--ink);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 10px 18px;
    font-family: 'Space Mono', monospace;
    font-size: 0.8rem;
    letter-spacing: 0.05em;
    cursor: pointer;
    transition: border-color 0.2s, background 0.2s;
  }
  button.btn:hover { border-color: var(--x); background: #1d242e; }
  button.btn.active { border-color: var(--o); color: var(--o); }

  .mode-switch {
    display: inline-flex;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 4px;
    gap: 4px;
  }
  .mode-switch button {
    background: transparent;
    color: var(--muted);
    border: none;
    border-radius: 8px;
    padding: 8px 16px;
    font-family: 'Space Mono', monospace;
    font-size: 0.78rem;
    letter-spacing: 0.05em;
    cursor: pointer;
    transition: background 0.2s, color 0.2s;
  }
  .mode-switch button:hover { color: var(--ink); }
  .mode-switch button.active {
    background: var(--line);
    color: var(--ink);
  }

  .scoreboard {
    display: flex;
    gap: 28px;
    font-size: 0.85rem;
  }
  .score { text-align: center; min-width: 60px; }
  .score .label { color: var(--muted); font-size: 0.65rem; letter-spacing: 0.15em; text-transform: uppercase; }
  .score .val { font-family: 'Fraunces', serif; font-weight: 900; font-size: 1.8rem; }
  .score.left .val { color: var(--x); }
  .score.right .val { color: var(--o); }

  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(8,10,14,0.78);
    backdrop-filter: blur(6px);
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s;
    z-index: 10;
  }
  .overlay.show { opacity: 1; pointer-events: auto; }
  .modal {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 20px;
    padding: 36px 32px;
    text-align: center;
    width: min(82vw, 320px);
    box-shadow: 0 40px 80px -20px rgba(0,0,0,0.7);
    transform: scale(0.85);
    transition: transform 0.28s cubic-bezier(.2,1.3,.4,1);
  }
  .overlay.show .modal { transform: scale(1); }
  .modal .emoji { font-size: 3rem; line-height: 1; }
  .modal h2 {
    font-family: 'Fraunces', serif;
    font-weight: 900;
    font-size: 2rem;
    margin: 14px 0 6px;
  }
  .modal p { color: var(--muted); font-size: 0.85rem; margin-bottom: 24px; }
  .modal button {
    background: var(--ink);
    color: var(--bg);
    border: none;
    border-radius: 10px;
    padding: 13px 28px;
    font-family: 'Space Mono', monospace;
    font-weight: 700;
    font-size: 0.9rem;
    letter-spacing: 0.05em;
    cursor: pointer;
    transition: transform 0.12s, opacity 0.2s;
  }
  .modal button:hover { transform: translateY(-2px); opacity: 0.9; }
</style>
</head>
<body>
  <header>
    <h1>TIC<span>·</span>TAC<span>·</span>TOE</h1>
    <div class="sub" id="subtitle">You vs. the machine</div>
  </header>

  <div class="mode-switch" id="modeSwitch">
    <button data-mode="ai" class="active">Vs AI</button>
    <button data-mode="pvp">2 Players</button>
  </div>

  <div class="status" id="status">Your move — you're X</div>

  <div class="board" id="board"></div>

  <div class="scoreboard">
    <div class="score left"><div class="label" id="lblLeft">You</div><div class="val" id="sLeft">0</div></div>
    <div class="score draw"><div class="label">Draw</div><div class="val" id="sDraw">0</div></div>
    <div class="score right"><div class="label" id="lblRight">AI</div><div class="val" id="sRight">0</div></div>
  </div>

  <div class="controls">
    <button class="btn" id="reset">New Round</button>
  </div>

  <div class="overlay" id="overlay">
    <div class="modal">
      <div class="emoji" id="mEmoji">🎉</div>
      <h2 id="mTitle">You win!</h2>
      <p id="mSub">Nicely played.</p>
      <button id="mPlay">Play Again</button>
    </div>
  </div>

<script>
  const X = 'X', O = 'O';
  const HUMAN = X, AI = O;
  let board = Array(9).fill('');
  let gameOver = false;
  let mode = 'ai';          // 'ai' or 'pvp'
  let currentPlayer = X;    // used in pvp mode
  const scores = { left: 0, draw: 0, right: 0 };

  const boardEl = document.getElementById('board');
  const statusEl = document.getElementById('status');
  const subtitleEl = document.getElementById('subtitle');
  const lblLeftEl = document.getElementById('lblLeft');
  const lblRightEl = document.getElementById('lblRight');
  const STORAGE_KEY = 'tic-tac-toe-progress';
  const wins = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];

  function loadGame() {
    try {
      return JSON.parse(localStorage.getItem(STORAGE_KEY));
    } catch {
      return null;
    }
  }

  function saveGame() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
      board,
      gameOver,
      mode,
      currentPlayer,
      scores,
      statusText: statusEl.textContent,
      statusColor: statusEl.style.color
    }));
  }

  function clearSavedGame() {
    localStorage.removeItem(STORAGE_KEY);
  }

  function restoreGame() {
    const saved = loadGame();
    if (!saved || !Array.isArray(saved.board) || saved.board.length !== 9) return;
    board = saved.board;
    gameOver = saved.gameOver || false;
    mode = saved.mode || 'ai';
    currentPlayer = saved.currentPlayer || X;
    Object.assign(scores, saved.scores || scores);
    if (saved.statusText) statusEl.textContent = saved.statusText;
    if (saved.statusColor) statusEl.style.color = saved.statusColor;
  }

  restoreGame();

  function applyModeUI() {
    document.querySelectorAll('#modeSwitch button').forEach(b => {
      b.classList.toggle('active', b.dataset.mode === mode);
    });
    if (mode === 'ai') {
      subtitleEl.textContent = 'You vs. the machine';
      lblLeftEl.textContent = 'You';
      lblRightEl.textContent = 'AI';
    } else {
      subtitleEl.textContent = 'Two-player duel';
      lblLeftEl.textContent = 'Player X';
      lblRightEl.textContent = 'Player O';
    }
  }

  function defaultStatus() {
    if (mode === 'ai') return "Your move — you're X";
    return currentPlayer === X ? "Player X's turn" : "Player O's turn";
  }

  function render() {
    boardEl.innerHTML = '';
    board.forEach((v, i) => {
      const btn = document.createElement('button');
      btn.className = 'cell' + (v ? ' ' + v.toLowerCase() : '');
      btn.disabled = !!v || gameOver;
      if (v) btn.innerHTML = `<span class="mark">${v}</span>`;
      btn.onclick = () => move(i);
      btn.dataset.i = i;
      boardEl.appendChild(btn);
    });
    saveGame();
  }

  function move(i) {
    if (board[i] || gameOver) return;
    if (mode === 'ai') {
      board[i] = HUMAN;
      render();
      if (checkEnd()) return;
      statusEl.textContent = 'Thinking…';
      setTimeout(aiMove, 350);
    } else {
      board[i] = currentPlayer;
      currentPlayer = currentPlayer === X ? O : X;
      render();
      if (checkEnd()) return;
      statusEl.textContent = currentPlayer === X ? "Player X's turn" : "Player O's turn";
      statusEl.style.color = currentPlayer === X ? 'var(--x)' : 'var(--o)';
    }
  }

  function aiMove() {
    const i = bestMove();
    board[i] = AI;
    render();
    if (checkEnd()) return;
    statusEl.textContent = "Your move — you're X";
    statusEl.style.color = 'var(--ink)';
  }

  function bestMove() {
    let best = -Infinity, idx = 0;
    board.forEach((v, i) => {
      if (!v) {
        board[i] = AI;
        const score = minimax(board, 0, false);
        board[i] = '';
        if (score > best) { best = score; idx = i; }
      }
    });
    return idx;
  }

  function minimax(b, depth, isMax) {
    const w = winner(b);
    if (w === AI) return 10 - depth;
    if (w === HUMAN) return depth - 10;
    if (b.every(c => c)) return 0;

    if (isMax) {
      let best = -Infinity;
      for (let i = 0; i < 9; i++) if (!b[i]) { b[i]=AI; best=Math.max(best,minimax(b,depth+1,false)); b[i]=''; }
      return best;
    } else {
      let best = Infinity;
      for (let i = 0; i < 9; i++) if (!b[i]) { b[i]=HUMAN; best=Math.min(best,minimax(b,depth+1,true)); b[i]=''; }
      return best;
    }
  }

  function winner(b) {
    for (const [a,c,d] of wins) if (b[a] && b[a]===b[c] && b[a]===b[d]) return b[a];
    return null;
  }

  function winningLine(b) {
    for (const line of wins) { const [a,c,d]=line; if (b[a] && b[a]===b[c] && b[a]===b[d]) return line; }
    return null;
  }

  function showModal(emoji, title, sub) {
    document.getElementById('mEmoji').textContent = emoji;
    document.getElementById('mTitle').textContent = title;
    document.getElementById('mSub').textContent = sub;
    setTimeout(() => document.getElementById('overlay').classList.add('show'), 600);
  }

  function checkEnd() {
    const w = winner(board);
    if (w) {
      gameOver = true;
      const line = winningLine(board);
      [...boardEl.children].forEach(c => { if (line.includes(+c.dataset.i)) c.classList.add('win'); });
      if (mode === 'ai') {
        if (w === HUMAN) {
          scores.left++;
          statusEl.textContent = 'You win! 🎉';
          statusEl.style.color = 'var(--x)';
          showModal('🎉', 'You win!', 'Nicely played.');
        } else {
          scores.right++;
          statusEl.textContent = 'AI wins.';
          statusEl.style.color = 'var(--o)';
          showModal('🤖', 'AI wins', 'The machine takes this one.');
        }
      } else {
        if (w === X) {
          scores.left++;
          statusEl.textContent = 'Player X wins! 🎉';
          statusEl.style.color = 'var(--x)';
          showModal('❌', 'Player X wins!', 'Hand the device to Player O.');
        } else {
          scores.right++;
          statusEl.textContent = 'Player O wins! 🎉';
          statusEl.style.color = 'var(--o)';
          showModal('⭕', 'Player O wins!', 'Hand the device to Player X.');
        }
      }
      updateScores();
      saveGame();
      return true;
    }
    if (board.every(c => c)) {
      gameOver = true;
      scores.draw++;
      statusEl.textContent = "Draw — nobody blinked.";
      statusEl.style.color = 'var(--muted)';
      showModal('🤝', 'Draw', 'Nobody blinked.');
      updateScores();
      saveGame();
      return true;
    }
    return false;
  }

  function updateScores() {
    document.getElementById('sLeft').textContent = scores.left;
    document.getElementById('sDraw').textContent = scores.draw;
    document.getElementById('sRight').textContent = scores.right;
  }

  function reset() {
    document.getElementById('overlay').classList.remove('show');
    board = Array(9).fill('');
    gameOver = false;
    currentPlayer = X;
    statusEl.textContent = defaultStatus();
    statusEl.style.color = mode === 'pvp' ? 'var(--x)' : 'var(--ink)';
    clearSavedGame();
    render();
  }

  function setMode(newMode) {
    if (newMode === mode) return;
    mode = newMode;
    scores.left = 0;
    scores.draw = 0;
    scores.right = 0;
    updateScores();
    applyModeUI();
    reset();
  }

  document.getElementById('reset').onclick = reset;
  document.getElementById('mPlay').onclick = reset;
  document.querySelectorAll('#modeSwitch button').forEach(b => {
    b.onclick = () => setMode(b.dataset.mode);
  });

  applyModeUI();
  updateScores();
  render();
</script>
</body>
</html>
