<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Handle Generator</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,400&family=JetBrains+Mono:wght@400;500;600&display=swap');

  :root {
    --bg: #14110f;
    --panel: #1c1815;
    --panel-2: #221d19;
    --ink: #e8e1d6;
    --ink-dim: #9c9388;
    --line: #322c26;
    --accent: #d49a5a;
    --accent-soft: rgba(212, 154, 90, 0.14);
    --green: #8fb573;
    --red: #c96f5a;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }

  body {
    background:
      radial-gradient(1000px 600px at 50% -15%, rgba(212,154,90,0.08), transparent 60%),
      var(--bg);
    color: var(--ink);
    font-family: 'JetBrains Mono', monospace;
    min-height: 100vh;
    padding-bottom: 60px;
  }

  header {
    text-align: center;
    padding: 32px 20px 8px;
  }
  header h1 {
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 2rem;
    letter-spacing: -0.01em;
  }
  header h1 .dot { color: var(--accent); }
  header .sub {
    font-family: 'Fraunces', serif;
    font-style: italic;
    color: var(--ink-dim);
    font-size: 1rem;
    margin-top: 4px;
  }

  .wrap {
    max-width: 820px;
    margin: 0 auto;
    padding: 24px;
    display: flex;
    flex-direction: column;
    gap: 24px;
  }

  .panel {
    background: linear-gradient(180deg, var(--panel), var(--bg));
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 22px 24px;
  }
  .panel h2 {
    font-size: 0.68rem;
    text-transform: uppercase;
    letter-spacing: 0.14em;
    color: var(--ink-dim);
    margin-bottom: 16px;
    font-weight: 500;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .panel h2 .meta {
    font-family: 'JetBrains Mono', monospace;
    font-weight: 400;
    color: var(--ink-dim);
    letter-spacing: 0.05em;
    text-transform: none;
    font-size: 0.66rem;
  }

  /* Options grid */
  .opt-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 16px 22px;
  }
  .field { display: flex; flex-direction: column; gap: 6px; }
  .field label {
    font-size: 0.66rem;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--ink-dim);
  }
  select, input[type="number"], input[type="text"] {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.84rem;
    color: var(--ink);
    background: var(--panel-2);
    border: 1px solid var(--line);
    padding: 9px 12px;
    border-radius: 8px;
    outline: none;
    transition: border-color 0.18s ease;
    width: 100%;
  }
  select:focus, input:focus { border-color: var(--accent); }

  .range-pair { display: flex; gap: 8px; align-items: center; }
  .range-pair input { flex: 1; min-width: 0; }
  .range-pair .dash { color: var(--ink-dim); font-size: 0.8rem; }

  .checks { display: flex; flex-wrap: wrap; gap: 10px 18px; }
  .check {
    display: flex; align-items: center; gap: 8px;
    font-size: 0.78rem; color: var(--ink); cursor: pointer;
    user-select: none;
  }
  .check input { accent-color: var(--accent); width: 16px; height: 16px; cursor: pointer; }

  .controls { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-top: 4px; }
  button {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.74rem;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--ink);
    background: var(--panel-2);
    border: 1px solid var(--line);
    padding: 12px 22px;
    border-radius: 9px;
    cursor: pointer;
    transition: all 0.18s ease;
  }
  button:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
  button:active { transform: translateY(1px); }
  button.primary { border-color: var(--accent); color: var(--accent); font-weight: 600; }
  button.ghost {
    padding: 10px 14px;
    font-size: 0.66rem;
  }

  .kbd {
    display: inline-block;
    padding: 1px 6px;
    margin-left: 6px;
    font-size: 0.62rem;
    color: var(--ink-dim);
    border: 1px solid var(--line);
    border-radius: 4px;
    background: var(--bg);
  }

  /* Results */
  .results { display: flex; flex-direction: column; gap: 0; }
  .handle {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 13px 4px;
    border-bottom: 1px solid var(--line);
    animation: fade 0.35s ease both;
    gap: 12px;
  }
  .handle:last-child { border-bottom: none; }
  .handle .name-wrap {
    display: flex;
    align-items: baseline;
    gap: 10px;
    min-width: 0;
    flex: 1;
  }
  .handle .name {
    font-family: 'Fraunces', serif;
    font-size: 1.32rem;
    font-weight: 600;
    letter-spacing: -0.01em;
    overflow-wrap: anywhere;
  }
  .handle .name .acc { color: var(--accent); }
  .handle .len {
    font-size: 0.62rem;
    color: var(--ink-dim);
    letter-spacing: 0.06em;
    white-space: nowrap;
    border: 1px solid var(--line);
    padding: 2px 6px;
    border-radius: 4px;
  }
  .handle .acts {
    display: flex;
    gap: 6px;
    opacity: 0;
    transition: opacity 0.18s;
    flex-shrink: 0;
  }
  .handle:hover .acts,
  .handle:focus-within .acts { opacity: 1; }
  .icon-btn {
    padding: 6px 9px;
    font-size: 0.6rem;
    border-radius: 6px;
    background: transparent;
  }
  .icon-btn.fav.active {
    color: var(--accent);
    border-color: var(--accent);
    background: var(--accent-soft);
    opacity: 1;
  }
  .handle .fav.active { opacity: 1; }
  .empty-state {
    color: var(--ink-dim);
    font-family: 'Fraunces', serif;
    font-style: italic;
    text-align: center;
    padding: 28px 0;
  }

  @keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

  .toast {
    position: fixed;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--panel-2);
    border: 1px solid var(--accent);
    color: var(--accent);
    padding: 10px 20px;
    border-radius: 8px;
    font-size: 0.72rem;
    letter-spacing: 0.06em;
    opacity: 0;
    pointer-events: none;
    transition: all 0.3s ease;
    z-index: 10;
    max-width: 90vw;
    text-align: center;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  details summary {
    cursor: pointer;
    font-size: 0.66rem;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--ink-dim);
    list-style: none;
    margin-bottom: 10px;
  }
  details summary::-webkit-details-marker { display: none; }
  details summary::before { content: '+ '; color: var(--accent); }
  details[open] summary::before { content: '\2212 '; }
  textarea.wordbox {
    width: 100%;
    min-height: 70px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.78rem;
    color: var(--ink);
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 10px 12px;
    outline: none;
    resize: vertical;
    line-height: 1.5;
  }
  textarea.wordbox:focus { border-color: var(--accent); }
  .custom-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 10px; }
  .custom-grid .field label { margin-bottom: 4px; }
  @media (max-width: 560px) {
    .custom-grid { grid-template-columns: 1fr; }
    .handle .acts { opacity: 1; }
    .handle .name { font-size: 1.15rem; }
  }

  .panel.favs h2 .clear-favs {
    background: transparent;
    border: 1px solid var(--line);
    padding: 4px 9px;
    font-size: 0.58rem;
    cursor: pointer;
    color: var(--ink-dim);
    border-radius: 5px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    transition: all 0.18s ease;
  }
  .panel.favs h2 .clear-favs:hover { color: var(--red); border-color: var(--red); }
  .favs-empty {
    color: var(--ink-dim);
    font-family: 'Fraunces', serif;
    font-style: italic;
    text-align: center;
    padding: 14px 0;
    font-size: 0.92rem;
  }
</style>
</head>
<body>
  <header>
    <h1>Handle Generator<span class="dot">.</span></h1>
    <div class="sub">combine word lists into usernames</div>
  </header>

  <div class="wrap">
    <div class="panel">
      <h2>Options <span class="meta" id="poolMeta"></span></h2>
      <div class="opt-grid">
        <div class="field">
          <label for="theme">Theme</label>
          <select id="theme">
            <option value="tech">Tech &amp; AI</option>
            <option value="cosmic">Cosmic</option>
            <option value="nature">Nature</option>
            <option value="retro">Retro Gamer</option>
            <option value="fantasy">Fantasy</option>
            <option value="cyberpunk">Cyberpunk</option>
            <option value="mythology">Mythology</option>
            <option value="ocean">Ocean</option>
            <option value="mixed">Mixed bag</option>
            <option value="madeup">Made-up (syllables)</option>
          </select>
        </div>
        <div class="field">
          <label for="pattern">Pattern</label>
          <select id="pattern">
            <option value="AN">Adjective + Noun</option>
            <option value="NN">Noun + Noun</option>
            <option value="AAN">Adj + Adj + Noun</option>
            <option value="ANnum">Adjective + Noun + Num</option>
            <option value="Nnum">Noun + Number</option>
            <option value="numAN">Number + Adj + Noun</option>
            <option value="A_N">Adjective_Noun</option>
            <option value="random">Surprise me</option>
          </select>
        </div>
        <div class="field">
          <label for="casing">Casing</label>
          <select id="casing">
            <option value="camel">camelCase</option>
            <option value="pascal">PascalCase</option>
            <option value="lower">lowercase</option>
            <option value="snake">snake_case</option>
            <option value="kebab">kebab-case</option>
          </select>
        </div>
        <div class="field">
          <label for="count">How many</label>
          <input type="number" id="count" value="8" min="1" max="50">
        </div>
        <div class="field">
          <label for="maxnum">Max number</label>
          <input type="number" id="maxnum" value="99" min="0" max="9999">
        </div>
        <div class="field">
          <label>Length range</label>
          <div class="range-pair">
            <input type="number" id="minLen" value="4" min="1" max="40" title="Min characters">
            <span class="dash">&ndash;</span>
            <input type="number" id="maxLen" value="20" min="1" max="40" title="Max characters">
          </div>
        </div>
        <div class="field">
          <label for="prefix">Prefix</label>
          <input type="text" id="prefix" placeholder="e.g. xX_" maxlength="6">
        </div>
        <div class="field">
          <label for="suffix">Suffix</label>
          <input type="text" id="suffix" placeholder="e.g. _Xx" maxlength="6">
        </div>
        <div class="field">
          <label for="contains">Must contain</label>
          <input type="text" id="contains" placeholder="e.g. fox" maxlength="20">
        </div>
      </div>

      <div class="checks" style="margin-top:18px;">
        <label class="check"><input type="checkbox" id="leet"> leetspeak (a&rarr;4, e&rarr;3)</label>
        <label class="check"><input type="checkbox" id="unique" checked> avoid repeats</label>
      </div>

      <div class="controls">
        <button class="primary" id="genBtn">Generate <span class="kbd">G</span></button>
        <button id="copyAllBtn">Copy all</button>
        <button id="downloadBtn">Download .txt</button>
      </div>
    </div>

    <div class="panel">
      <details>
        <summary>Custom word lists (optional)</summary>
        <p style="font-size:0.74rem;color:var(--ink-dim);line-height:1.5;">Add your own words (comma or newline separated). When filled, these override the selected theme.</p>
        <div class="custom-grid">
          <div class="field">
            <label>Adjectives</label>
            <textarea class="wordbox" id="customAdj" placeholder="swift, neon, quiet&hellip;"></textarea>
          </div>
          <div class="field">
            <label>Nouns</label>
            <textarea class="wordbox" id="customNoun" placeholder="fox, circuit, river&hellip;"></textarea>
          </div>
        </div>
      </details>
    </div>

    <div class="panel">
      <h2>Generated handles <span class="meta" id="resultsMeta"></span></h2>
      <div class="results" id="results">
        <div class="empty-state">Press Generate to conjure some handles.</div>
      </div>
    </div>

    <div class="panel favs" id="favsPanel" style="display:none;">
      <h2>
        <span>Favorites <span class="meta" id="favMeta"></span></span>
        <button class="clear-favs" id="clearFavs">Clear</button>
      </h2>
      <div class="results" id="favsList"></div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

<script>
  const WORDS = {
    tech: {
      adj: ['quantum','neural','async','binary','cyber','digital','silicon','vector','pixel','cloud','turbo','hyper','smart','logic','crypto','data','byte','nano','meta','quad'],
      noun: ['circuit','daemon','kernel','vector','token','cipher','matrix','proxy','router','compiler','pixel','cache','thread','packet','script','widget','codec','schema','buffer','node']
    },
    cosmic: {
      adj: ['stellar','lunar','solar','cosmic','astral','nebular','orbital','galactic','radiant','void','celestial','meteor','plasma','aurora','quasar','dark','bright','distant','crimson','silent'],
      noun: ['nebula','comet','quasar','pulsar','nova','orbit','eclipse','galaxy','meteor','cosmos','star','moon','aurora','horizon','void','crater','rocket','satellite','asteroid','photon']
    },
    nature: {
      adj: ['wild','misty','quiet','ancient','golden','silver','autumn','rugged','still','frosty','verdant','mossy','crimson','amber','hidden','rolling','windy','sunlit','dewy','feral'],
      noun: ['fox','river','cedar','falcon','willow','ember','meadow','canyon','otter','heron','birch','thistle','glacier','timber','raven','maple','brook','pine','marsh','wolf']
    },
    retro: {
      adj: ['pixel','arcade','turbo','neon','retro','glitch','laser','chrome','vapor','radical','mega','ultra','synth','blast','epic','wired','rad','prime','atomic','rogue'],
      noun: ['blaster','joystick','arcade','sprite','warp','combo','boss','quest','dungeon','loot','glitch','pixel','console','level','score','vortex','raider','phantom','knight','sentinel']
    },
    fantasy: {
      adj: ['mystic','ancient','arcane','shadow','crystal','dragon','elder','enchanted','runic','silver','frost','flame','storm','iron','wandering','forgotten','sacred','wicked','noble','ember'],
      noun: ['mage','rogue','knight','wizard','sorcerer','paladin','druid','ranger','warrior','bard','sentinel','warden','oracle','phoenix','dragon','wyrm','rune','grimoire','sigil','blade']
    },
    cyberpunk: {
      adj: ['neon','chrome','toxic','rogue','synth','wired','dystopian','grim','jacked','shattered','hacked','encrypted','underground','virtual','augmented','black','red','volt','ghost','razor'],
      noun: ['runner','hacker','ronin','samurai','mercenary','ghost','choom','netrunner','fixer','blade','wire','grid','shard','protocol','agent','signal','module','spike','glitch','syndicate']
    },
    mythology: {
      adj: ['eternal','divine','fabled','olympian','titanic','immortal','primordial','sacred','golden','ancient','revered','heroic','mortal','cursed','blessed','fated','exiled','silent','vengeful','dawn'],
      noun: ['titan','oracle','hydra','sphinx','minotaur','phoenix','centaur','siren','valkyrie','hermes','atlas','nyx','helios','styx','orion','aegis','olympus','thanatos','chimera','hecate']
    },
    ocean: {
      adj: ['deep','tidal','briny','salty','glacial','sunken','azure','coral','pelagic','abyssal','foaming','silver','silent','restless','crimson','jade','hidden','rolling','frothy','drifting'],
      noun: ['kraken','reef','tide','marlin','squid','pearl','wave','current','shark','barnacle','anchor','harbor','mermaid','whale','dolphin','octopus','shoal','lagoon','trench','urchin']
    }
  };

  function pool(theme) {
    if (theme === 'mixed') {
      const adj = [], noun = [];
      Object.entries(WORDS).forEach(([k, w]) => {
        if (k === 'madeup') return;
        adj.push(...w.adj); noun.push(...w.noun);
      });
      return { adj, noun };
    }
    if (theme === 'madeup') return makeUpPool();
    return WORDS[theme];
  }

  // Syllable-based fictional word generator. Produces 30 adj-like and
  // 30 noun-like words per call so each generation feels fresh.
  const SYL = {
    onset: ['b','br','c','ch','cr','d','dr','f','fr','g','gr','h','j','k','kr','l','m','n','p','pr','qu','r','s','sh','sk','sl','sn','sp','st','str','t','th','tr','v','w','wr','x','y','z','zh'],
    vowel: ['a','e','i','o','u','ae','ai','ea','ee','ia','io','oa','ou','ya','yo','y'],
    coda:  ['','','','n','r','l','s','sh','th','ck','x','rn','st','rk','lt','nd','m','ph','t']
  };
  const rand1 = arr => arr[Math.floor(Math.random() * arr.length)];

  function madeUpWord(syllables = 2 + Math.floor(Math.random() * 2)) {
    let w = '';
    for (let i = 0; i < syllables; i++) {
      const onset = i === 0 ? rand1(SYL.onset) : (Math.random() < 0.75 ? rand1(SYL.onset) : '');
      const vowel = rand1(SYL.vowel);
      const coda = i === syllables - 1 ? rand1(SYL.coda) : (Math.random() < 0.3 ? rand1(SYL.coda) : '');
      w += onset + vowel + coda;
    }
    // simple cleanups
    w = w.replace(/(.)\1{2,}/g, '$1$1');
    return w;
  }

  function makeUpPool() {
    const adj = [], noun = [];
    for (let i = 0; i < 30; i++) adj.push(madeUpWord(2));
    for (let i = 0; i < 30; i++) noun.push(madeUpWord(2 + Math.floor(Math.random() * 2)));
    return { adj, noun };
  }

  const $ = id => document.getElementById(id);
  const results = $('results');
  const favsList = $('favsList');
  const favsPanel = $('favsPanel');
  const toast = $('toast');

  const FAV_KEY = 'handleGenerator.favs.v1';
  const SETTINGS_KEY = 'handleGenerator.settings.v1';
  const SETTING_IDS = ['theme','pattern','casing','count','maxnum','minLen','maxLen','prefix','suffix','contains'];
  const SETTING_CHECKS = ['leet','unique'];
  let favorites = loadFavorites();

  function loadFavorites() {
    try {
      const raw = localStorage.getItem(FAV_KEY);
      return raw ? JSON.parse(raw) : [];
    } catch { return []; }
  }
  function saveFavorites() {
    try { localStorage.setItem(FAV_KEY, JSON.stringify(favorites)); } catch {}
  }

  function loadSettings() {
    try {
      const raw = localStorage.getItem(SETTINGS_KEY);
      if (!raw) return;
      const s = JSON.parse(raw);
      SETTING_IDS.forEach(id => { if (s[id] !== undefined && $(id)) $(id).value = s[id]; });
      SETTING_CHECKS.forEach(id => { if (s[id] !== undefined && $(id)) $(id).checked = !!s[id]; });
    } catch {}
  }
  function saveSettings() {
    try {
      const s = {};
      SETTING_IDS.forEach(id => { if ($(id)) s[id] = $(id).value; });
      SETTING_CHECKS.forEach(id => { if ($(id)) s[id] = $(id).checked; });
      localStorage.setItem(SETTINGS_KEY, JSON.stringify(s));
    } catch {}
  }

  function showToast(msg) {
    toast.textContent = msg;
    toast.classList.add('show');
    clearTimeout(showToast._t);
    showToast._t = setTimeout(() => toast.classList.remove('show'), 1600);
  }

  const rand = arr => arr[Math.floor(Math.random() * arr.length)];
  const cap = s => s.charAt(0).toUpperCase() + s.slice(1);

  function parseCustom(text) {
    return text.split(/[,\n]/).map(s => s.trim().toLowerCase()).filter(Boolean);
  }

  function applyLeet(s) {
    return s.replace(/a/gi,'4').replace(/e/gi,'3').replace(/i/gi,'1').replace(/o/gi,'0').replace(/s/gi,'5');
  }

  function buildHandle(parts, casing) {
    if (casing === 'pascal') return parts.map(cap).join('');
    if (casing === 'camel') return parts.map((p,i) => i ? cap(p) : p).join('');
    if (casing === 'lower') return parts.join('');
    if (casing === 'snake') return parts.join('_');
    if (casing === 'kebab') return parts.join('-');
    return parts.join('');
  }

  const PATTERNS = ['AN','NN','AAN','ANnum','Nnum','numAN','A_N'];

  function pickParts(pattern, adj, noun) {
    let parts = [];
    let numPosition = 'end'; // 'end' | 'start' | null
    let withNum = false;

    switch (pattern) {
      case 'AN':    parts = [rand(adj), rand(noun)]; break;
      case 'NN':    parts = [rand(noun), rand(noun)]; break;
      case 'AAN':   parts = [rand(adj), rand(adj), rand(noun)]; break;
      case 'ANnum': parts = [rand(adj), rand(noun)]; withNum = true; break;
      case 'Nnum':  parts = [rand(noun)]; withNum = true; break;
      case 'numAN': parts = [rand(adj), rand(noun)]; withNum = true; numPosition = 'start'; break;
      case 'A_N':   parts = [rand(adj), rand(noun)]; break;
    }
    return { parts, withNum, numPosition };
  }

  function makeOne(opts) {
    const { adj, noun, pattern, casing, maxnum, prefix, suffix, leet } = opts;
    const actualPattern = pattern === 'random'
      ? PATTERNS[Math.floor(Math.random() * PATTERNS.length)]
      : pattern;

    const { parts, withNum, numPosition } = pickParts(actualPattern, adj, noun);
    let handle = buildHandle(parts, casing);

    if (withNum && maxnum > 0) {
      const num = Math.floor(Math.random() * (maxnum + 1));
      const sep = casing === 'snake' ? '_' : casing === 'kebab' ? '-' : '';
      if (numPosition === 'start') handle = num + sep + handle;
      else handle = handle + sep + num;
    }

    if (leet) handle = applyLeet(handle);
    if (prefix) handle = prefix + handle;
    if (suffix) handle = handle + suffix;

    return handle;
  }

  function readOpts() {
    const theme = $('theme').value;
    const customAdj = parseCustom($('customAdj').value);
    const customNoun = parseCustom($('customNoun').value);
    const base = pool(theme);
    const adj = customAdj.length ? customAdj : base.adj;
    const noun = customNoun.length ? customNoun : base.noun;

    return {
      adj, noun,
      pattern: $('pattern').value,
      casing: $('casing').value,
      count: Math.max(1, Math.min(50, parseInt($('count').value) || 8)),
      maxnum: Math.max(0, parseInt($('maxnum').value) || 0),
      minLen: Math.max(1, parseInt($('minLen').value) || 1),
      maxLen: Math.max(1, parseInt($('maxLen').value) || 40),
      prefix: $('prefix').value.trim(),
      suffix: $('suffix').value.trim(),
      contains: $('contains').value.trim().toLowerCase(),
      leet: $('leet').checked,
      unique: $('unique').checked,
      customAdjCount: customAdj.length,
      customNounCount: customNoun.length
    };
  }

  function updatePoolMeta(opts) {
    const meta = $('poolMeta');
    const aSource = opts.customAdjCount ? `${opts.customAdjCount} custom adj` : `${opts.adj.length} adj`;
    const nSource = opts.customNounCount ? `${opts.customNounCount} custom noun` : `${opts.noun.length} noun`;
    meta.textContent = `${aSource} / ${nSource}`;
  }

  function generate() {
    const opts = readOpts();
    updatePoolMeta(opts);
    saveSettings();

    if (!opts.adj.length || !opts.noun.length) {
      results.innerHTML = '<div class="empty-state">Need at least one adjective and one noun.</div>';
      $('resultsMeta').textContent = '';
      return;
    }

    const out = [];
    const seen = new Set();
    let guard = 0;
    const maxGuard = opts.count * 80;
    const needsContains = opts.contains.length > 0;

    while (out.length < opts.count && guard < maxGuard) {
      guard++;
      const handle = makeOne(opts);
      const lower = handle.toLowerCase();
      const len = handle.length;

      if (len < opts.minLen || len > opts.maxLen) continue;
      if (needsContains && !lower.includes(opts.contains)) continue;
      if (opts.unique && seen.has(lower)) continue;

      seen.add(lower);
      out.push(handle);
    }

    render(out, opts);
  }

  function regenerateAt(index) {
    const opts = readOpts();
    if (!opts.adj.length || !opts.noun.length) return;

    const current = (results.dataset.all || '').split('\n');
    const others = new Set(current.filter((_, i) => i !== index).map(s => s.toLowerCase()));
    const needsContains = opts.contains.length > 0;

    let next = null;
    for (let i = 0; i < 200; i++) {
      const h = makeOne(opts);
      const lower = h.toLowerCase();
      if (h.length < opts.minLen || h.length > opts.maxLen) continue;
      if (needsContains && !lower.includes(opts.contains)) continue;
      if (opts.unique && others.has(lower)) continue;
      next = h;
      break;
    }
    if (!next) { showToast('Could not find another match'); return; }

    current[index] = next;
    render(current, opts);
  }

  function highlightNumbers(h) {
    return h.replace(/(\d+)/g, '<span class="acc">$1</span>');
  }

  function isFavorited(h) {
    return favorites.includes(h);
  }

  function toggleFav(h) {
    const i = favorites.indexOf(h);
    if (i >= 0) { favorites.splice(i, 1); showToast('Removed from favorites'); }
    else { favorites.push(h); showToast('Saved to favorites'); }
    saveFavorites();
    renderFavorites();
    // Update star state in results
    document.querySelectorAll('.results .fav').forEach(btn => {
      const name = btn.dataset.handle;
      btn.classList.toggle('active', favorites.includes(name));
      btn.textContent = favorites.includes(name) ? '★' : '☆';
    });
  }

  function makeRow(h, opts, opts_) {
    const row = document.createElement('div');
    row.className = 'handle';
    const favActive = isFavorited(h);
    row.innerHTML = `
      <span class="name-wrap">
        <span class="name">${highlightNumbers(escapeHtml(h))}</span>
        <span class="len">${h.length}</span>
      </span>
      <span class="acts">
        <button class="icon-btn fav ${favActive ? 'active' : ''}" data-handle="${escapeAttr(h)}" title="Favorite">${favActive ? '★' : '☆'}</button>
        <button class="icon-btn copy" title="Copy">Copy</button>
        ${opts_ && opts_.allowRegen ? '<button class="icon-btn regen" title="Re-roll">↻</button>' : ''}
        ${opts_ && opts_.allowRemove ? '<button class="icon-btn remove" title="Remove">✕</button>' : ''}
      </span>`;
    return row;
  }

  function escapeHtml(s) {
    return s.replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
  }
  function escapeAttr(s) { return escapeHtml(s); }

  function render(handles, opts) {
    if (!handles.length) {
      results.innerHTML = '<div class="empty-state">No matches &mdash; try relaxing the filters.</div>';
      $('resultsMeta').textContent = '';
      results.dataset.all = '';
      return;
    }
    results.innerHTML = '';
    handles.forEach((h, i) => {
      const row = makeRow(h, opts, { allowRegen: true });
      row.style.animationDelay = (i * 0.03) + 's';

      row.querySelector('.copy').addEventListener('click', () => copyText(h));
      row.querySelector('.fav').addEventListener('click', () => toggleFav(h));
      const regen = row.querySelector('.regen');
      if (regen) regen.addEventListener('click', () => regenerateAt(i));

      results.appendChild(row);
    });
    results.dataset.all = handles.join('\n');

    const avg = Math.round(handles.reduce((s, h) => s + h.length, 0) / handles.length);
    $('resultsMeta').textContent = `${handles.length} handles · avg ${avg} chars`;
  }

  function renderFavorites() {
    if (!favorites.length) {
      favsPanel.style.display = 'none';
      return;
    }
    favsPanel.style.display = '';
    favsList.innerHTML = '';
    favorites.slice().reverse().forEach(h => {
      const row = makeRow(h, null, { allowRemove: true });
      row.querySelector('.copy').addEventListener('click', () => copyText(h));
      row.querySelector('.fav').addEventListener('click', () => toggleFav(h));
      const rm = row.querySelector('.remove');
      if (rm) rm.addEventListener('click', () => toggleFav(h));
      favsList.appendChild(row);
    });
    $('favMeta').textContent = `${favorites.length} saved`;
  }

  async function copyText(t) {
    try { await navigator.clipboard.writeText(t); showToast('Copied: ' + t); }
    catch { showToast('Copy failed'); }
  }

  $('genBtn').addEventListener('click', generate);

  $('copyAllBtn').addEventListener('click', async () => {
    const all = results.dataset.all || '';
    if (!all) { showToast('Generate some first'); return; }
    try { await navigator.clipboard.writeText(all); showToast('Copied all handles'); }
    catch { showToast('Copy failed'); }
  });

  $('downloadBtn').addEventListener('click', () => {
    const all = results.dataset.all || '';
    if (!all) { showToast('Generate some first'); return; }
    const blob = new Blob([all + '\n'], { type: 'text/plain' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    const ts = new Date().toISOString().slice(0,10);
    a.href = url;
    a.download = `handles-${ts}.txt`;
    a.click();
    URL.revokeObjectURL(url);
    showToast('Downloaded');
  });

  $('clearFavs').addEventListener('click', () => {
    if (!favorites.length) return;
    if (confirm('Clear all favorites?')) {
      favorites = [];
      saveFavorites();
      renderFavorites();
      // Update result stars
      document.querySelectorAll('.results .fav').forEach(btn => {
        btn.classList.remove('active');
        btn.textContent = '☆';
      });
      showToast('Favorites cleared');
    }
  });

  ['count','maxnum','prefix','suffix','contains','minLen','maxLen'].forEach(id =>
    $(id).addEventListener('keydown', e => { if (e.key === 'Enter') generate(); })
  );

  // Global keyboard shortcut: G to regenerate (not when typing in input)
  document.addEventListener('keydown', e => {
    if (e.key.toLowerCase() === 'g' && !e.ctrlKey && !e.metaKey && !e.altKey) {
      const tag = (e.target.tagName || '').toLowerCase();
      if (tag === 'input' || tag === 'textarea' || tag === 'select') return;
      e.preventDefault();
      generate();
    }
  });

  loadSettings();
  renderFavorites();
  generate();
</script>
</body>
</html>
